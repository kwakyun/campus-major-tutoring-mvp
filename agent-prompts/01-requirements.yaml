# 에이전트에게 전달할 계획된 명령 프롬프트입니다. 쉘 스크립트가 아닙니다.
schema_version: "1.0"
kind: agent_prompt_stage
id: S01
order: 1
title: 요구사항·정책·범위
status: PLANNED
common_file: agent-prompts/00-workflow.yaml
goal: 기존 설계를 구현 가능한 P0 요구사항과 검증 기준으로 바꾼다.
requires_stage_gates: []
entry_checks:
  - 기존 기술·사업 문서, 첨부 HWPX·PDF, agent-prompts/source-alignment.md를 읽을 수 있다.
dispatch_prompt: A0는 공통 지침과 실제 선행 결과를 확인한 후 commands.order 순서대로 한 명령씩 전달하라. 각 담당자는 자기 명령만 수행한다. 마지막 S01-GATE의 판정으로 현재 단계를 마무리한다.
commands:
  - id: S01-T01
    order: 1
    agent: A0
    title: P0 요구사항과 정책 결정표 작성
    status: PLANNED
    depends_on: []
    condition: always
    prompt: |-
      너는 전공한시간의 A0 총괄·제품·통합 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      사업계획서와 아키텍처를 읽고 1:1·단일 차시·한 생활권 기준의 첫 파일럿 범위를 정리하라.
      역할별 사용자 행동에 요구사항 ID를 붙이고 P0/P1/P2를 구분하라.
      교육자 수수료 15%·학습자 플랫폼 수수료 0원은 현재 구현 기준으로, 보증금 20%·취소 24시간·가격 하한은 제안으로 분리하라.
      결제 대기·한쪽 미납·완료 미응답·분쟁·정산 정책마다 현재 결정 상태와 결정 시점을 적어라.
      학습 내용·수준·기한·유료 의사·모집 가능성으로 초기 고객군을 선택할 기준을 정하고 대학생과 편입준비생의 가설을 분리하라.
      학습자 6명(대학생 4명·편입준비생 2명)·교육자 후보 3명 인터뷰안, 구체적 신청 의사 3명·시간/주제 일치 1건의 시연 검증안을 작성하라. 이는 실제 모집·유료 완료가 아니다.
      PDF의 10시간 시연과 HWPX의 1단계 미정, 파일럿 일정·거래 목표·15% 수수료의 표현 차이를 결정표에 남겨라. 기존 15%·0원 구현 기준을 유지하되 공급자 수락률 검증 대상으로 표시하라.
      사업 단계와 S01~S10 개발 단계를 구분하고, 목표 10·30건의 집계 단위와 30일 재예약 관찰 기준을 결정하라. 미정이면 관련 달성 판정만 보류하라.
      HWPX의 6개 제출 항목에 기존 근거·누락 자료를 연결하되 양식을 임의 완성하거나 BMC 촬영·지원사업 신청을 실행하지 마라. 신뢰·목표/결과·대기 신청·재예약을 초기 범위에, 그룹·지역 확장·지인 추천 보상을 후속 범위에 배치하라.
    allowed_paths:
      - docs/product/**
      - docs/decisions/**
      - docs/tasks/index.md
      - docs/handoffs/S01-T01.md
    expected_outputs:
      - docs/product/requirements.md
      - docs/decisions/policies.md
      - docs/tasks/index.md
      - docs/product/source-traceability.md
      - docs/product/interview-plan.md
      - docs/product/submission-evidence-map.md
    acceptance_criteria:
      - 핵심 정상·실패 시나리오에 요구사항 ID가 있음
      - 미정 정책을 확정 사실로 쓰지 않음
      - 고객군·시연·유료 파일럿·제출 항목·충돌·집계 단위가 분리되고 원문 항목에 추적됨
    handoff_file: docs/handoffs/S01-T01.md
    source_requirements:
      - SRC-01
      - SRC-07
      - SRC-09
      - SRC-11
      - SRC-12
  - id: S01-T02
    order: 2
    agent: A1
    title: 기술 범위와 외부 의존 확인
    status: PLANNED
    depends_on:
      - S01-T01
    condition: always
    prompt: |-
      너는 전공한시간의 A1 아키텍처·DB·API 계약 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      P0 요구사항을 업무 모듈과 데이터에 연결하라.
      Next.js·NestJS·PostgreSQL 기반과 이후 Python/FastAPI·pgvector 도입 경계를 확인하라.
      추가 설계가 필요한 상태·권한·동시성·외부 제공자 의존을 목록화하라. 이번 작업에서는 프로젝트 코드를 생성하지 마라.
      학교·캠퍼스와 생활권을 별도 개념으로 두고 대체 시간·대기 신청·학습 결과·교육 활동·채널 지표를 기존 설계의 추가 범위로 매핑하라. 기존 루트 설계에 이미 반영됐다고 쓰지 말고 S02 계약 통합 항목을 명시하라.
    allowed_paths:
      - docs/architecture/**
      - docs/handoffs/S01-T02.md
    expected_outputs:
      - docs/architecture/requirements-map.md
    acceptance_criteria:
      - P0 요구사항마다 담당 모듈이 연결됨
      - 거래 정확성·AI 장애 격리 요구가 포함됨
      - 첨부 자료의 추가 요구사항과 기존 설계 차이마다 소유자·반영 단계가 지정됨
    handoff_file: docs/handoffs/S01-T02.md
    source_requirements:
      - SRC-02
      - SRC-04
      - SRC-08
      - SRC-12
  - id: S01-T03
    order: 3
    agent: A6
    title: 요구사항의 완료 조건 정의
    status: PLANNED
    depends_on:
      - S01-T02
    condition: always
    prompt: |-
      너는 전공한시간의 A6 QA·품질 검증 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      요구사항별 정상·실패·권한·동시성 검증 조건을 작성하라.
      오래된 제안 수락, 중복 예약, 금액 조작, 한쪽만 납부, 완료 미응답, 분쟁 중 지급을 포함하라.
      현재 실행 가능한 검증과 향후 구현·외부 환경이 필요한 검증을 구분하라.
      대학 미재학 학습자, 학교 인증과 교육 능력의 혼동, 빈 추천과 대기 신청, 학습 결과 접근 권한, 실제 거래와 데모 지표 혼입, 분모 없는 달성 주장을 인수 기준에 포함하라. 개인 경험·소수 인터뷰로 학습 효과를 입증했다는 문구와 미확인 제휴·팀 경력을 검증 대상으로 남겨라.
    allowed_paths:
      - docs/qa/**
      - docs/handoffs/S01-T03.md
    expected_outputs:
      - docs/qa/acceptance-matrix.md
    acceptance_criteria:
      - 요구사항과 검증 사례가 연결됨
      - 구현되지 않은 기능을 테스트 통과로 쓰지 않음
      - 목표·가정·근거·실제 성과의 구분을 검증할 사례가 있음
    handoff_file: docs/handoffs/S01-T03.md
    source_requirements:
      - SRC-01
      - SRC-02
      - SRC-07
      - SRC-11
      - SRC-12
  - id: S01-GATE
    order: 4
    agent: A0
    title: 1단계 통합 검증과 완료 판정
    status: PLANNED
    depends_on:
      - S01-T01
      - S01-T02
      - S01-T03
    condition: always
    prompt: |-
      너는 A0 총괄·통합 담당이다.
      이 단계의 모든 명령 보고와 QA 결과를 확인하고 exit_criteria를 기준으로 통합 버전을 판정하라.
      실패·미검증·외부 의존은 숨기지 말고 소유자에게 보완 작업을 배분하라. 필요한 보완이 완료되면 동일 기준으로 재검증하라.
      완료되지 않은 필수 명령을 임의로 건너뛰지 마라.
      통합 완료 여부와 근거·남은 사항·다음 실행 가능 명령을 기록하라. 다음 단계는 자동 실행하지 마라.
      첨부 문서 반영 사항도 source_requirements 및 agent-prompts/source-alignment.md에 연결해 검증하라.
    allowed_paths:
      - docs/tasks/index.md
      - docs/decisions/**
      - docs/releases/**
      - docs/handoffs/S01-GATE.md
    expected_outputs:
      - docs/releases/S01-gate.md
      - docs/tasks/index.md
    acceptance_criteria:
      - 학습자·교육자·운영자의 P0 요구사항과 검증 기준이 연결됨
      - 확정 규칙·미정 정책·외부 의존이 구분됨
      - 원문 충돌과 신규 요구사항을 추적하고 시연·파일럿 범위 및 지표 단위의 결정 상태를 명시함
    handoff_file: docs/handoffs/S01-GATE.md
exit_criteria:
  - 학습자·교육자·운영자의 P0 요구사항과 검증 기준이 연결됨
  - 확정 규칙·미정 정책·외부 의존이 구분됨
  - 원문 충돌과 신규 요구사항을 추적하고 시연·파일럿 범위 및 지표 단위의 결정 상태를 명시함
content_revision: 2026-09-19.sources-v2
source_alignment_file: agent-prompts/source-alignment.md
