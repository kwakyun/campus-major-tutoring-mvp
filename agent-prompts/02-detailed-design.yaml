# 에이전트에게 전달할 계획된 명령 프롬프트입니다. 쉘 스크립트가 아닙니다.
schema_version: "1.0"
kind: agent_prompt_stage
id: S02
order: 2
title: 화면·DB·API 상세 설계
status: PLANNED
common_file: agent-prompts/00-workflow.yaml
goal: 역할별 구현자가 공유할 화면·데이터·API·이벤트 계약을 확정한다.
requires_stage_gates:
  - S01-GATE
entry_checks:
  - S01 통합 완료 보고와 P0 요구사항이 준비됨
dispatch_prompt: A0는 공통 지침과 실제 선행 결과를 확인한 후 commands.order 순서대로 한 명령씩 전달하라. 각 담당자는 자기 명령만 수행한다. 마지막 S02-GATE의 판정으로 현재 단계를 마무리한다.
commands:
  - id: S02-T01
    order: 1
    agent: A1
    title: 핵심 DB·API 계약 초안
    status: PLANNED
    depends_on:
      - S01-GATE
    condition: always
    prompt: |-
      너는 전공한시간의 A1 아키텍처·DB·API 계약 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      회원·교육자·수업·가능 시간·협의·제안·동의·예약·회차·납부 의무의 모델을 상세화하라.
      OpenAPI에 입력·응답·오류·권한·멱등키를 정의하고 금액·시간·정책 버전 규칙을 명시하라.
      DB 고유 제약·시간 중복 제약과 원자적으로 변경할 트랜잭션 경계를 설계하라.
      고객군·학습 목표·선수 수준·필요 단원·기한·예산·가능 시간을 모델링하라. 대학 미재학 상태를 지원하고 학교/캠퍼스 소속과 학습 생활권을 분리하라.
      학교·전공·경력·자격의 자기기재와 운영 확인 상태, 비공개 증빙, 샘플 설명·예상 결과물, 대체 시간 제안·대기 신청의 상태와 접근 권한을 계약에 포함하라.
      학습 결과·목표 달성 응답·다음 학습 단계·원본 예약을 참조하는 재예약 요청, 소유자 커리큘럼 복제·버전·교육 활동 집계 계약을 설계하라. 공개 포트폴리오는 별도 동의 범위를 정의하라.
    allowed_paths:
      - packages/contracts/**
      - docs/architecture/**
      - docs/api/**
      - docs/handoffs/S02-T01.md
    expected_outputs:
      - packages/contracts/openapi.yaml
      - docs/architecture/data-model.md
      - docs/architecture/state-machines.md
      - docs/api/authorization.md
    acceptance_criteria:
      - 예약·결제·환불 상태가 구분됨
      - 동시 재제안·수락과 중복 예약 거절 규칙이 있음
      - 학교 인증이 교육 능력 인증으로 표시되지 않고 대기·결과·재예약 계약과 개인정보 권한이 정의됨
    handoff_file: docs/handoffs/S02-T01.md
    source_requirements:
      - SRC-01
      - SRC-02
      - SRC-03
      - SRC-04
      - SRC-08
  - id: S02-T02
    order: 2
    agent: A3
    title: 사용자 흐름과 화면 상태 설계
    status: PLANNED
    depends_on:
      - S02-T01
    condition: always
    prompt: |-
      너는 전공한시간의 A3 UX·프론트엔드 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      학습자 탐색→협의→동의→예약, 교육자 등록·수업 관리, 운영자 심사·매칭·분쟁 흐름을 설계하라.
      로딩·빈 결과·권한 오류·오래된 제안·결제 확인 중 상태와 모바일 표시를 정의하라.
      API와 맞지 않는 필드는 계약 변경 요청으로 남겨라.
      대학생·편입준비생 진입 문구, 시간·결과물·가격을 함께 보는 수업 카드, 샘플 설명과 확인 상태를 설계하라. 매칭 실패 시 대체 시간 확인·대기 신청을 제공하고 완료 결과·다음 단계·재예약·교육 활동 화면을 정의하라.
    allowed_paths:
      - docs/ux/**
      - docs/handoffs/S02-T02.md
    expected_outputs:
      - docs/ux/flows.md
      - docs/ux/screens.md
      - docs/ux/contract-requests.md
    acceptance_criteria:
      - 화면별 필요한 API와 상태가 연결됨
      - 수업료·양측 보증금·수수료·정산액을 구분함
      - 빈 매칭의 후속 행동과 학습 전후 흐름이 설계되고 합격·자격·취업 보장 문구가 없음
    handoff_file: docs/handoffs/S02-T02.md
    source_requirements:
      - SRC-01
      - SRC-02
      - SRC-03
      - SRC-04
  - id: S02-T03
    order: 3
    agent: A4
    title: 금액 처리 계약 제안
    status: PLANNED
    depends_on:
      - S02-T02
    condition: always
    prompt: |-
      너는 전공한시간의 A4 결제·보증금·정산 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      납부 의무·결제 시도·환불·보증금 처분·원장·지급 인터페이스를 설계하라.
      Booking과 Billing의 호출·트랜잭션 경계 및 분쟁 중 지급 보류를 명시하라.
      보증금 수납·보상 방식의 제공자 지원이 미확정이면 미확정으로 기록하라. 공통 계약은 직접 바꾸지 말고 A1에 반영 요청을 제출하라.
      수수료는 최종 합의 수업료 기준이며 보증금은 매출에서 제외하라. 납부액·수수료·PG 비용·환불·기타 변동비를 분리한 분석 계약을 제안하라.
      15,000원·PG 3.4%·기타 200원·월 고정비 100만원·과세 가정은 예시 시나리오로 두고 실제 PG·세금 정책과 분리하라. 준비 예산·월 비용·수동 운영 비용의 귀속과 중복 계상 방지 규칙을 정의하라.
    allowed_paths:
      - docs/payments/**
      - docs/handoffs/S02-T03.md
    expected_outputs:
      - docs/payments/contracts-proposal.md
    acceptance_criteria:
      - 15% 수수료의 기준은 최종 합의 수업료임
      - 보증금 반환과 피해자 보상 지급이 구분됨
      - 거래 원장과 예시 수익성 가정이 분리되고 보증금·지원금이 거래 매출에 섞이지 않음
    handoff_file: docs/handoffs/S02-T03.md
    source_requirements:
      - SRC-06
      - SRC-12
  - id: S02-T04
    order: 4
    agent: A5
    title: 추천·이벤트·AI 계약 제안
    status: PLANNED
    depends_on:
      - S02-T03
    condition: always
    prompt: |-
      너는 전공한시간의 A5 AI·추천·데이터 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      필수 조건과 선호 조건, 후보 자격 조회, 추천 이유 코드, 실제 노출·상담·합의·납부·완료 이벤트를 정의하라.
      거래 이벤트의 발행자는 업무 서버와 Billing으로 두고 클라이언트 노출 이벤트와 구분하라.
      AI 내부 API·버전·입력 데이터 범위·대체 경로를 제안하여 A1에 넘겨라.
      source-alignment의 지표 정의를 계약화하라. 고객군·유입 채널·상담·예약·유료 전환·완료·목표 달성·정산 만족도·재예약과 매칭 실패 사유(시간·가격·주제/수준·품질)를 구분하라.
      예약 수·유료 수강 수·완료 수강 수·학습자 시간 단위를 별도 필드로 두고 시간대·코호트·환불·취소·귀속 기간·분모 0·중복 제거를 정의하라. 서버 거래 사실과 설문 자기보고를 분리하라.
      30일 재예약은 관찰이 끝난 고유 학습자를 분모로 하고 확정/납부 인정 시점과 취소 처리 정책을 명시하라. 원문 10·30건의 단위는 S01 결정과 연결하라.
    allowed_paths:
      - docs/ai/**
      - docs/handoffs/S02-T04.md
    expected_outputs:
      - docs/ai/contracts-proposal.md
      - docs/ai/metrics-contract-proposal.md
    acceptance_criteria:
      - Python은 거래 원본 변경 권한을 갖지 않음
      - 신규 사용자·교육자와 AI 장애의 대체 경로가 정의됨
      - 같은 입력으로 지표를 재현할 수 있고 노출·예약·수강·시간 단위 및 재예약 관찰 기간이 구분됨
    handoff_file: docs/handoffs/S02-T04.md
    source_requirements:
      - SRC-01
      - SRC-05
      - SRC-07
      - SRC-10
  - id: S02-T05
    order: 5
    agent: A1
    title: 공통 계약 통합 및 버전 지정
    status: PLANNED
    depends_on:
      - S02-T04
    condition: always
    prompt: |-
      너는 전공한시간의 A1 아키텍처·DB·API 계약 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      UX·Billing·추천 담당의 계약 제안을 검토해 OpenAPI·이벤트·내부 모듈 계약에 통합하라.
      필드·상태·오류 코드의 충돌을 해결하고 버전을 지정하라.
      클라이언트 생성 방식, migration 원칙, 모듈 간 트랜잭션 전달 방법을 문서화하라.
      신규 요구사항을 source-traceability에 대조해 계약에 통합하고 학습·대기·재예약·채널·재무 지표의 상태·권한·버전을 명시하라. 확장 전에도 학교와 생활권을 식별할 수 있게 하되 다지역 기능을 선구현하지 마라.
    allowed_paths:
      - packages/contracts/**
      - docs/architecture/**
      - docs/api/**
      - docs/handoffs/S02-T05.md
    expected_outputs:
      - packages/contracts/openapi.yaml
      - packages/contracts/events.yaml
      - docs/api/internal-contracts.md
      - docs/architecture/contract-baseline.md
    acceptance_criteria:
      - 각 역할이 동일한 계약 버전을 참조할 수 있음
      - 미정 정책과 확정 API 형태가 구분됨
      - 각 SRC 요구사항이 계약 또는 명시적인 후속 범위에 연결됨
    handoff_file: docs/handoffs/S02-T05.md
    source_requirements:
      - SRC-01
      - SRC-02
      - SRC-03
      - SRC-04
      - SRC-05
      - SRC-06
      - SRC-08
  - id: S02-T06
    order: 6
    agent: A6
    title: 설계 일관성 검토
    status: PLANNED
    depends_on:
      - S02-T05
    condition: always
    prompt: |-
      너는 전공한시간의 A6 QA·품질 검증 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      P0 요구사항·화면·OpenAPI·DB·상태·권한·이벤트 계약을 대조하라.
      자기 거래, 다른 사람 자원 접근, 재제안 경쟁, 부분 납부, 환불·정산 충돌의 처리 근거를 확인하라.
      발견사항을 소유자와 재현 가능한 조건으로 보고하라.
      타인의 학습 결과·신원 증빙 접근, 무단 포트폴리오 공개, 과거 커리큘럼 수정, 재예약 자동 청구, 시간 환산·완료율·30일 분모·환불 지표의 모순을 검토하라.
    allowed_paths:
      - docs/qa/**
      - docs/handoffs/S02-T06.md
    expected_outputs:
      - docs/qa/S02-design-review.md
    acceptance_criteria:
      - 필수 흐름마다 구현·검증 근거가 있음
      - 중요한 불일치가 해결되거나 단계 미완료로 보고됨
      - 새 데이터의 공개 범위와 지표 계산 경계 사례가 검토됨
    handoff_file: docs/handoffs/S02-T06.md
    source_requirements:
      - SRC-02
      - SRC-03
      - SRC-04
      - SRC-05
      - SRC-06
  - id: S02-GATE
    order: 7
    agent: A0
    title: 2단계 통합 검증과 완료 판정
    status: PLANNED
    depends_on:
      - S02-T01
      - S02-T02
      - S02-T03
      - S02-T04
      - S02-T05
      - S02-T06
    condition: always
    prompt: |-
      너는 A0 총괄·통합 담당이다.
      이 단계의 모든 명령 보고와 QA 결과를 확인하고 exit_criteria를 기준으로 통합 버전을 판정하라.
      실패·미검증·외부 의존은 숨기지 말고 소유자에게 보완 작업을 배분하라. 필요한 보완이 완료되면 동일 기준으로 재검증하라.
      완료되지 않은 필수 명령을 임의로 건너뛰지 마라.
      통합 완료 여부와 근거·남은 사항·다음 실행 가능 명령을 기록하라. 다음 단계는 자동 실행하지 마라.
      첨부 문서 반영 사항도 source_requirements 및 agent-prompts/source-alignment.md에 연결해 검증하라.
    allowed_paths:
      - docs/tasks/index.md
      - docs/decisions/**
      - docs/releases/**
      - docs/handoffs/S02-GATE.md
    expected_outputs:
      - docs/releases/S02-gate.md
      - docs/tasks/index.md
    acceptance_criteria:
      - 화면·API·DB·권한·상태 계약이 일치함
      - 제안→동의→예약→금액 처리 인터페이스가 정의됨
      - 학습 목표·품질·대기·재이용·생활권·지표의 추가 계약이 통합됨
    handoff_file: docs/handoffs/S02-GATE.md
exit_criteria:
  - 화면·API·DB·권한·상태 계약이 일치함
  - 제안→동의→예약→금액 처리 인터페이스가 정의됨
  - 학습 목표·품질·대기·재이용·생활권·지표의 추가 계약이 통합됨
content_revision: 2026-09-19.sources-v2
source_alignment_file: agent-prompts/source-alignment.md
