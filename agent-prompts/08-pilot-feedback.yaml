# 에이전트에게 전달할 계획된 명령 프롬프트입니다. 쉘 스크립트가 아닙니다.
schema_version: "1.0"
kind: agent_prompt_stage
id: S08
order: 8
title: 파일럿 준비·실제 기록 분석·개선
status: PLANNED
common_file: agent-prompts/00-workflow.yaml
goal: 준비된 파일럿 범위와 실제 제공된 사용·거래 기록을 분석하고 개선 순서를 정한다.
requires_stage_gates:
  - S07-GATE
entry_checks:
  - S07 실거래 진입 조건이 충족됨
  - 실제 파일럿 데이터 접근 또는 운영자가 제공한 기록의 존재 여부를 확인함
dispatch_prompt: A0는 공통 지침과 실제 선행 결과를 확인한 후 commands.order 순서대로 한 명령씩 전달하라. 각 담당자는 자기 명령만 수행한다. 마지막 S08-GATE의 판정으로 현재 단계를 마무리한다.
commands:
  - id: S08-T01
    order: 1
    agent: A0
    title: 파일럿 계획과 기록 범위 정리
    status: PLANNED
    depends_on:
      - S07-GATE
    condition: always
    prompt: |-
      너는 전공한시간의 A0 총괄·제품·통합 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      한 생활권·소수 과목·초기 참여자 범위, 관찰 지표, 사건 처리 책임을 정리하라.
      사업계획서의 사용자 수와 거래 목표를 확보 실적으로 표현하지 마라.
      이 명령은 모집 연락·공개 배포·거래 실행 지시가 아니다. 실제 이용 기록이 없으면 준비 문서를 작성하고 데이터 의존 작업을 대기 상태로 남겨라.
      한 대학 생활권·1~2개 과목, 교육자 3~5명 선확보 후 학습자 약 10명, 운영 준비 후 유료 10건을 계획 가정으로 제시하라. MVP 이후 2~4주와 선정 후 3개월 차의 원문 차이를 남기고 실제 시작일·관찰 일정을 작성하라.
      교육자의 커리큘럼·샘플 설명·가능 시간을 먼저 확인하고 대학생/편입준비생별 상담 질문·모집 문구·채널별 측정안을 준비하라. 커뮤니티 규정·연락 범위 확인은 계획에 남기며 이번 명령으로 게시·연락하지 마라.
      10건의 집계 단위, 목표 달성·정산 만족도·운영 비용·30일 재예약 코호트와 관찰 종료일을 확인하라. 데이터가 없으면 계획만 완료하고 실제 기록 의존 명령은 BLOCKED로 남겨라.
    allowed_paths:
      - docs/product/**
      - docs/decisions/**
      - docs/releases/**
      - docs/handoffs/S08-T01.md
    expected_outputs:
      - docs/product/pilot-plan.md
      - docs/releases/pilot-data-inventory.md
    acceptance_criteria:
      - 목표·실제 수치·미확보 데이터를 구분함
      - 분석에 사용할 실제 기록과 범위가 확인됨
      - 공급 우선 모집안·수치의 단위·시작 기준·관찰 기간·실제 기록 유무가 명시됨
    handoff_file: docs/handoffs/S08-T01.md
    source_requirements:
      - SRC-01
      - SRC-05
      - SRC-07
      - SRC-11
      - SRC-12
  - id: S08-T02
    order: 2
    agent: A7
    title: 실제 운영 로그와 복구 지표 점검
    status: PLANNED
    depends_on:
      - S08-T01
    condition: always
    prompt: |-
      너는 전공한시간의 A7 개발 기반·배포·운영 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      접근 가능한 파일럿 로그의 오류·작업 적체·연결·알림·복구 이력을 읽고 분석하라.
      실명·계좌·토큰·메시지 본문을 일반 보고서에 복사하지 마라.
      기록이 없으면 관측 준비 상태와 데이터 부족을 보고하고 장애 없는 운영을 달성했다고 쓰지 마라.
    allowed_paths:
      - docs/operations/**
      - docs/handoffs/S08-T02.md
    expected_outputs:
      - docs/operations/pilot-observability.md
    acceptance_criteria:
      - 분석 시점·대상 환경·실제 관측 범위를 명시함
      - 민감정보를 보고서에 노출하지 않음
    handoff_file: docs/handoffs/S08-T02.md
  - id: S08-T03
    order: 3
    agent: A4
    title: 파일럿 거래 대사
    status: PLANNED
    depends_on:
      - S08-T02
    condition: always
    prompt: |-
      너는 전공한시간의 A4 결제·보증금·정산 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      실제 제공된 결제·환불·지급·원장을 대조하고 미납·UNKNOWN·환불 실패·지급 실패·분쟁 보류를 분류하라.
      분석만으로 실금액 재처리나 송금을 실행하지 마라.
      데이터가 없으면 대사 양식과 필요한 입력을 제공하되 검증 완료로 보고하지 마라.
      실제 PG·환불·수수료·기타 변동비·수동 운영 비용으로 단위당 공헌이익을 대사하라. 예약/수강/시간 단위별 분모를 표시하고 초기 준비 예산·월 고정비·지원금·팀 자체 부담을 분리하라.
      비용 자료가 빠지면 알려진 비용 범위의 잠정값으로 표시하라. 원문 15,000원 시나리오와 손익표를 가정별로 재계산해 차이를 설명하고 이를 실제 실적으로 바꾸지 마라.
    allowed_paths:
      - docs/payments/**
      - docs/handoffs/S08-T03.md
    expected_outputs:
      - docs/payments/pilot-reconciliation.md
    acceptance_criteria:
      - 불일치와 미처리 금액을 추적할 수 있음
      - 실제 거래가 없는데 대사 완료라고 쓰지 않음
      - 실제 비용의 확보 범위와 가정이 구분되고 수익성·원장 대사가 재현됨
    handoff_file: docs/handoffs/S08-T03.md
    source_requirements:
      - SRC-06
  - id: S08-T04
    order: 4
    agent: A5
    title: 실제 전환·추천 품질 분석
    status: PLANNED
    depends_on:
      - S08-T03
    condition: always
    prompt: |-
      너는 전공한시간의 A5 AI·추천·데이터 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      실제 노출→상담→합의→납부→완료와 취소·재예약을 분석하라.
      분자·분모·유입 경로를 표시하고 공급 시간·가격·설명 문제와 추천 순위 문제를 구분하라.
      적은 표본이나 예시 데이터를 성능 입증으로 쓰지 말고 다음 실험의 가설을 제안하라.
      고객군·채널별 상담→예약→첫 유료 수강과 CAC, 공급자 제안 수락·재등록, 목표 달성 응답·정산 만족도·매칭 실패 사유를 분석하라.
      30일 재예약은 관찰 기간이 끝난 고유 학습자만 분모에 포함하고 인원·기간·분모 0·미성숙 코호트를 명시하라. 누적 유료 30건·완료율 80%·재예약률 30%와 현재 값을 잠정 비교하되 단위 미정이면 달성 판정을 보류하라.
      수요 부족이면 고객/과목, 일정 불일치면 공통 시간 그룹의 후속 실험을 제안하라. 거래당 공헌이익·수동 운영 부담을 함께 판단하고 학습 효과의 인과 관계를 소수 표본으로 주장하지 마라.
    allowed_paths:
      - docs/ai/**
      - docs/handoffs/S08-T04.md
    expected_outputs:
      - docs/ai/pilot-analysis.md
    acceptance_criteria:
      - 분석 근거와 표본 한계가 드러남
      - 개선 우선순위가 실제 문제와 연결됨
      - 분자·분모·관찰 기간·단위·표본 수와 비용을 포함한 확장 판단 자료가 있음
    handoff_file: docs/handoffs/S08-T04.md
    source_requirements:
      - SRC-01
      - SRC-05
      - SRC-07
  - id: S08-T05
    order: 5
    agent: A6
    title: 사용자 결함 재현과 개선 목록
    status: PLANNED
    depends_on:
      - S08-T04
    condition: always
    prompt: |-
      너는 전공한시간의 A6 QA·품질 검증 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      제공된 사용자 기록·로그·대사·분석에서 중요한 결함을 재현하라.
      예상·실제 결과·영향·소유자·재현 입력을 작성하고 기존 검증 누락을 보완하라.
      수정은 코드 소유자에게 넘기고 수정된 통합 버전에서 관련 회귀 검증을 수행하라.
      학습 결과·재예약·활동 보고서 결함과 잘못된 지표 분모·시간 환산·채널 귀속을 재현하라. 사용자 응답 부족과 구현 결함을 구분하라.
    allowed_paths:
      - tests/**
      - docs/qa/**
      - docs/handoffs/S08-T05.md
    expected_outputs:
      - docs/qa/S08-pilot-defects.md
    acceptance_criteria:
      - 중요 결함의 처리 상태와 남은 위험이 명확함
      - 재현하지 못한 문제를 해결 완료로 표시하지 않음
      - 실제 지표와 재이용 기능의 오류를 소유자별로 재현·보고함
    handoff_file: docs/handoffs/S08-T05.md
    source_requirements:
      - SRC-04
      - SRC-05
      - SRC-07
  - id: S08-GATE
    order: 6
    agent: A0
    title: 8단계 통합 검증과 완료 판정
    status: PLANNED
    depends_on:
      - S08-T01
      - S08-T02
      - S08-T03
      - S08-T04
      - S08-T05
    condition: always
    prompt: |-
      너는 A0 총괄·통합 담당이다.
      이 단계의 모든 명령 보고와 QA 결과를 확인하고 exit_criteria를 기준으로 통합 버전을 판정하라.
      실패·미검증·외부 의존은 숨기지 말고 소유자에게 보완 작업을 배분하라. 필요한 보완이 완료되면 동일 기준으로 재검증하라.
      완료되지 않은 필수 명령을 임의로 건너뛰지 마라.
      실제 파일럿 기록이 없으면 파일럿 검증 완료로 판정하지 마라.
      통합 완료 여부와 근거·남은 사항·다음 실행 가능 명령을 기록하라. 다음 단계는 자동 실행하지 마라.
      잠정 사업 목표의 달성 여부와 소프트웨어 검증 완료 여부를 별도로 판정하라. 30일 관찰 미완료는 데이터 한계로 명시하고 재예약 검증을 PASS로 표시하지 마라. 그 지표에 의존하는 확장은 보류하되 검증한 다른 소프트웨어 결과를 숨기지 마라.
      첨부 문서 반영 사항도 source_requirements 및 agent-prompts/source-alignment.md에 연결해 검증하라.
    allowed_paths:
      - docs/tasks/index.md
      - docs/decisions/**
      - docs/releases/**
      - docs/handoffs/S08-GATE.md
    expected_outputs:
      - docs/releases/S08-gate.md
      - docs/tasks/index.md
    acceptance_criteria:
      - 실제 기록 기반으로 거래 대사·사용성·추천·운영 문제를 확인함
      - 검증하지 못한 실운영과 미해결 중요 결함을 완료로 표현하지 않음
      - 실제 성과·잠정 목표·관찰 미완료를 구분하고 수익성·재이용·공급 품질을 검토함
    handoff_file: docs/handoffs/S08-GATE.md
exit_criteria:
  - 실제 기록 기반으로 거래 대사·사용성·추천·운영 문제를 확인함
  - 검증하지 못한 실운영과 미해결 중요 결함을 완료로 표현하지 않음
  - 실제 성과·잠정 목표·관찰 미완료를 구분하고 수익성·재이용·공급 품질을 검토함
