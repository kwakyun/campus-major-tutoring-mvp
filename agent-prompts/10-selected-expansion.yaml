# 에이전트에게 전달할 계획된 명령 프롬프트입니다. 쉘 스크립트가 아닙니다.
schema_version: "1.0"
kind: agent_prompt_stage
id: S10
order: 10
title: 선택한 개인화·그룹·복수 차시·성능·지역·지인 추천 보상 확장
status: PLANNED
common_file: agent-prompts/00-workflow.yaml
goal: 검증된 수요에 따라 하나의 확장 트랙을 선택하고 관련 역할만 구현한다.
requires_stage_gates:
  - S08-GATE
entry_checks:
  - S08 실제 이용 근거와 중요 결함 처리 상태가 준비됨
  - 학습 기반 개인화를 선택하면 S09 평가 기반과 충분한 데이터가 추가로 필요함
  - 지역 확장 또는 보상에 필요한 실제 재이용·수익성·운영 비용 자료와 정책을 확인함
selection:
  source: docs/product/expansion-selection.md
  variable: selected_track
  allowed_values:
    - personalization
    - group
    - multi_session
    - performance
    - campus_area_expansion
    - referral_rewards
  rule: 한 번 실행할 때 트랙 하나를 선택한다. 재실행 전 A0가 이전 결과를 docs/product/expansion-runs/<run_id>/에 보존한다. 현재 handoff 경로에는 최신 실행 결과를 기록한다.
dispatch_prompt: A0는 공통 지침과 실제 선행 결과를 확인한 후 commands.order 순서대로 한 명령씩 전달하라. 각 담당자는 자기 명령만 수행한다. 마지막 S10-GATE의 판정으로 현재 단계를 마무리한다.
commands:
  - id: S10-T01
    order: 1
    agent: A0
    title: 확장 트랙 하나 선택
    status: PLANNED
    depends_on:
      - S08-GATE
    condition: always
    prompt: |-
      너는 전공한시간의 A0 총괄·제품·통합 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      파일럿의 실제 문제·데이터·운영 조건을 근거로 personalization·group·multi_session·performance·campus_area_expansion·referral_rewards 중 하나의 트랙을 제안·선정하라.
      선택 이유·기대 효과·범위·필요한 정책·평가 기준을 기록하라.
      근거가 없거나 필수 정책·데이터가 부족하면 준비할 작업을 제시하고 이번 확장 실행을 대기시켜라.
      지역 확장은 잠정 30건·80%·30% 기준의 단위·관찰 기간·표본 수와 공헌이익·수동 운영 비용, 신규 생활권 공급/수요를 검토하라. 숫자 충족만으로 자동 확장하지 마라.
      referral_rewards는 지인 유입 보상이며 AI 순위 기능과 다르다. 보상 수단·금액·전체/개인 예산·자격·완료 확정 시점·환불/분쟁 회수·중복/자기 추천 정책을 먼저 결정하라. 미정이면 보상 구현을 BLOCKED로 남겨라.
      같은 단계 반복 시 run_id를 발급하고 기존 S10 명령·단계 보고서의 사본과 정책·파일 해시를 docs/product/expansion-runs/<run_id>/에 보존하라. 각 담당자는 지정된 handoff 경로에 최신 결과를 기록하고 이번 run_id를 명시하라.
    allowed_paths:
      - docs/product/**
      - docs/decisions/**
      - docs/handoffs/S10-T01.md
    expected_outputs:
      - docs/product/expansion-selection.md
    acceptance_criteria:
      - 선택 트랙과 근거·평가 기준이 명확함
      - 조건 부족을 임의의 가정으로 완료 처리하지 않음
      - 선택 확장의 관찰·수익성·정책 근거가 준비되고 다른 트랙과 실행 결과를 혼합하지 않음
    handoff_file: docs/handoffs/S10-T01.md
    source_requirements:
      - SRC-05
      - SRC-06
      - SRC-07
      - SRC-08
      - SRC-09
  - id: S10-T02
    order: 2
    agent: A1
    title: 선택 트랙의 계약·DB 변경
    status: PLANNED
    depends_on:
      - S10-T01
    condition: always
    prompt: |-
      너는 전공한시간의 A1 아키텍처·DB·API 계약 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      선택 트랙에 필요한 API·상태·데이터·이벤트·migration만 설계하고 적용하라.
      그룹은 참여자별 납부·출석·최소 인원, 복수 차시는 회차별 배분·부분 제공·환불 규칙을 정의하라.
      개인화·성능 트랙에서도 원본 거래 일관성과 이전 모델·배포 복구 경로를 유지하라.
      지역 확장이면 학교/캠퍼스와 생활권의 관계·허용 모집 영역·대면 장소·이동 조건·운영 범위·지역별 지표 계약을 확장하라. 타 학교 이용을 무조건 금지하거나 학교 제휴를 전제하지 마라.
      지인 추천 보상이면 유입 귀속·완료 이벤트·자격 상태·예산 예약/확정/회수·고유 보상 키와 Billing 인터페이스를 설계하라. 금융 처리는 A4, 자격·귀속은 A2가 담당한다.
    allowed_paths:
      - db/**
      - packages/contracts/**
      - docs/architecture/**
      - docs/api/**
      - docs/handoffs/S10-T02.md
    expected_outputs:
      - docs/architecture/selected-expansion.md
      - packages/contracts/
    acceptance_criteria:
      - 선택한 트랙의 구현·검증 계약이 준비됨
      - 기존 예약 정책과 이력을 소급 변경하지 않음
      - 지역 또는 보상 선택 시 소유권·권한·멱등성·기존 거래 보존 계약이 준비됨
    handoff_file: docs/handoffs/S10-T02.md
    source_requirements:
      - SRC-08
      - SRC-09
  - id: S10-T03
    order: 3
    agent: A5
    title: 개인화 또는 생활권 추천 조건 구현
    status: PLANNED
    depends_on:
      - S10-T02
    condition: selected_track in [personalization, campus_area_expansion]
    prompt: |-
      너는 전공한시간의 A5 AI·추천·데이터 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      personalization을 선택한 경우에만 선택된 개인화 범위에 맞춰 허용된 관심·완료 이력 특징을 사용하라.
      personalization의 학습 모델은 시간 기준으로 평가 데이터를 나누고 미래 후기·최종 가격 정보가 과거 특징에 섞이지 않게 하라.
      personalization은 기본 추천과 비교하고 버전 복구·개인화 해제·신규 사용자 대체 경로를 유지하라.
      campus_area_expansion이면 생활권별 후보·이동 선호·가능 시간 조건을 기본 추천에 반영하고 학교/생활권 혼동·신규 지역 콜드스타트를 평가하라. 이 트랙 때문에 학습 모델이나 S09를 필수로 추가하지 마라.
    allowed_paths:
      - apps/api/src/modules/recommendations/**
      - services/ai/**
      - docs/ai/**
      - docs/handoffs/S10-T03.md
    expected_outputs:
      - docs/ai/selected-expansion-evaluation.md
    acceptance_criteria:
      - 선택 트랙의 기준 방식과 비교하고 개인정보·필수 조건 준수를 검증함
      - 개인화는 모델 복구, 지역 확장은 조건 설정 복구 경로가 있음
      - 지역 확장은 AI 학습 데이터 없이도 조건 추천을 유지함
    handoff_file: docs/handoffs/S10-T03.md
    source_requirements:
      - SRC-08
      - SRC-10
  - id: S10-T04
    order: 4
    agent: A2
    title: 선택한 수업·지역·지인 추천 업무 구현
    status: PLANNED
    depends_on:
      - S10-T03
    condition: selected_track in [group, multi_session, campus_area_expansion, referral_rewards]
    prompt: |-
      너는 전공한시간의 A2 핵심 업무 백엔드 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      선택 트랙만 구현하라.
      그룹이면 정원·참여자별 동의·모집 마감·최소 인원·좌석 동시성·변경 재동의를 처리하라.
      복수 차시면 회차별 일정·출석·완료·부분 제공을 처리하라.
      금액 변경은 Billing 계약을 통하고 참가자에게 추가 금액을 자동 청구하지 마라.
      campus_area_expansion이면 허용 생활권·캠퍼스·대면 장소·운영 조회 범위를 계약대로 구현하고 지역별 모집 상태와 공급 부족을 기록하라.
      referral_rewards이면 추천 코드/링크 귀속·자기 추천/중복 방지·완료/환불/분쟁 이벤트의 자격 전이를 구현하라. 보상 자격과 금액 처리를 분리하고 Billing의 멱등 계약으로 예산 예약·확정·회수를 요청하라. 실제 보상 지급을 실행하지 마라.
    allowed_paths:
      - apps/api/src/** (billing 및 recommendations 제외)
      - packages/domain/time/**
      - docs/backend/**
      - docs/handoffs/S10-T04.md
    expected_outputs:
      - docs/backend/selected-expansion.md
    acceptance_criteria:
      - 선택 트랙의 상태·권한·동시성 규칙이 유지됨
      - 선택한 지역 또는 보상 업무가 권한·중복·이벤트 순서 역전에 안전함
    handoff_file: docs/handoffs/S10-T04.md
    source_requirements:
      - SRC-08
      - SRC-09
  - id: S10-T05
    order: 5
    agent: A4
    title: 선택한 수업 금액 또는 지인 추천 보상 원장
    status: PLANNED
    depends_on:
      - S10-T04
    condition: selected_track in [group, multi_session, referral_rewards]
    prompt: |-
      너는 전공한시간의 A4 결제·보증금·정산 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      group 또는 multi_session을 선택한 경우 그 계약의 납부·보증금·정산·부분 환불·수수료 조정을 구현하라.
      group 또는 multi_session이면 부분 환불 누적 반올림 오차, 최소 인원 미달, 보증금 배분 상한을 검증하라.
      새 정책을 과거 확정 예약에 소급 적용하지 마라.
      referral_rewards이면 결정된 보상 정책을 버전으로 저장하고 완료 근거·자격·고유 키에 따른 예산 예약/확정/취소·환불 후 회수를 구현하라. 전체/개인 한도 경쟁을 원자적으로 처리하고 보상 비용을 수익성 분석에 한 번만 반영하라. 테스트 대역으로 검증하며 현금·포인트 중 미정 수단을 임의 선택하거나 실지급하지 마라.
    allowed_paths:
      - apps/api/src/modules/billing/**
      - packages/domain/money/**
      - docs/payments/**
      - docs/handoffs/S10-T05.md
    expected_outputs:
      - docs/payments/selected-expansion.md
    acceptance_criteria:
      - 선택 트랙의 수강 금액 또는 보상 예산·원장 합계가 일치함
      - 기존 예약 금액이 변하지 않음
      - 보상은 실제 완료 자격과 정책을 충족해야 확정되고 중복·한도 초과·환불 후 잔액 오류가 차단됨
    handoff_file: docs/handoffs/S10-T05.md
    source_requirements:
      - SRC-06
      - SRC-09
  - id: S10-T06
    order: 6
    agent: A3
    title: 선택 기능의 화면 구현
    status: PLANNED
    depends_on:
      - S10-T05
    condition: selected_track in [personalization, group, multi_session, campus_area_expansion, referral_rewards]
    prompt: |-
      너는 전공한시간의 A3 UX·프론트엔드 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      선택 트랙의 사용자 흐름을 API 계약에 연결하라.
      개인화는 추천 근거·해제, 그룹은 참여·최소 인원·결제, 복수 차시는 회차별 상태·금액을 명확히 표시하라.
      기존 1:1 예약·환불 흐름의 회귀를 확인하라.
      지역 확장은 활동 생활권·가능 시간·대면 장소·모집 제한을 보여주고 미확보 학교/공간 제휴를 표시하지 마라. 지인 추천 보상은 자격·완료 대기·확정·취소/회수·한도를 API 상태대로 표시하고 AI 수업 추천과 다른 메뉴·설명을 사용하라.
    allowed_paths:
      - apps/web/**
      - packages/ui/**
      - docs/ux/**
      - docs/handoffs/S10-T06.md
    expected_outputs:
      - docs/ux/selected-expansion.md
      - apps/web/
    acceptance_criteria:
      - 선택 기능의 정상·실패 상태가 실제 API와 연결됨
      - 선택한 확장의 조건과 실제 상태가 표시되고 허위 제휴·미확정 보상 약속이 없음
    handoff_file: docs/handoffs/S10-T06.md
    source_requirements:
      - SRC-08
      - SRC-09
  - id: S10-T07
    order: 7
    agent: A7
    title: 측정된 병목의 실행 구조 개선
    status: PLANNED
    depends_on:
      - S10-T06
    condition: selected_track == performance
    prompt: |-
      너는 전공한시간의 A7 개발 기반·배포·운영 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      측정된 DB·worker·검색·채팅 병목과 목표를 확인하고 필요한 실행 단위만 개선하라.
      업무 코드 수정이 필요하면 A0를 통해 A2·A5의 범위가 분명한 후속 작업을 요청하라.
      이전 구성과 비용·지연·처리량·복구를 비교하고 측정 없이 전면 분산 구조를 도입하지 마라.
    allowed_paths:
      - infra/**
      - scripts/**
      - .github/workflows/**
      - docs/operations/**
      - pnpm-lock.yaml
      - docs/handoffs/S10-T07.md
    expected_outputs:
      - docs/operations/performance-comparison.md
    acceptance_criteria:
      - 측정된 병목과 개선 결과가 연결됨
      - 기존 구성으로 복구할 수 있음
    handoff_file: docs/handoffs/S10-T07.md
  - id: S10-T08
    order: 8
    agent: A6
    title: 선택 확장과 기존 기능 회귀 검증
    status: PLANNED
    depends_on:
      - S10-T07
    condition: always
    prompt: |-
      너는 전공한시간의 A6 QA·품질 검증 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      선택 트랙의 완료 기준과 기존 회원·권한·협의·예약·결제·환불 회귀를 검증하라.
      미선택 트랙은 NOT_APPLICABLE 사유를 확인하고 선택 트랙의 누락을 건너뛰기로 숨기지 마라.
      효과 근거와 중요한 결함이 남았는지 보고하라.
      지역 확장은 다른 대학/같은 생활권 및 같은 대학/다른 생활권 사례와 권한·공급 부족을 검증하라. 보상은 자기 추천·중복 이벤트·예산 마지막 잔액 동시 사용·환불/분쟁 순서 역전·회수·실지급 차단을 검증하라. 기존 1:1·후기·재예약·지표 계산의 회귀를 확인하라.
