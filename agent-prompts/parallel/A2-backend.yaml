schema_version: "1.0"
kind: parallel_role_dispatch
status: PLANNED
role: A2
name: 핵심 업무 백엔드
common_file: agent-prompts/00-workflow.yaml
parallel_plan: agent-prompts/parallel/00-orchestration.yaml
responsibility: 인증·회원·수업·협의·예약·운영·outbox를 구현한다. 대기 신청·학습 결과·재예약·교육 활동 기록과 선택한 지역·지인 추천 업무를 담당한다.
write_paths:
  - apps/api/src/**
  - apps/worker/src/**
  - packages/domain/time/**
  - docs/backend/**
excluded_paths:
  - apps/api/src/modules/billing/**
  - apps/api/src/modules/recommendations/**
write_scope_rule: 현재 원본 명령 allowed_paths와 교집합만 수정한다. 원본의 현재 handoff는 complete_original에서만, 준비 보고서는 prepare에서만 쓴다. 역할 목록은 소유권 확대 권한이 아니다.
command_refs:
  - id: S03-T03
    stage: S03
    source_file: agent-prompts/03-project-foundation.yaml
    title: 인증과 서버 공통 기반
    condition: always
  - id: S04-T01
    stage: S04
    source_file: agent-prompts/04-users-courses-discovery.yaml
    title: 회원·교육자·수업·시간 API
    condition: always
  - id: S05-T03
    stage: S05
    source_file: agent-prompts/05-negotiation-booking.yaml
    title: 메시지·제안·동의·예약 구현
    condition: always
  - id: S06-T03
    stage: S06
    source_file: agent-prompts/06-mock-transactions-operations.yaml
    title: 수업 완료·취소·신고·작업 처리
    condition: always
  - id: S07-T03
    stage: S07
    source_file: agent-prompts/07-payments-release-readiness.yaml
    title: 실제 거래 상태와 예약·분쟁 연결
    condition: always
  - id: S09-T04
    stage: S09
    source_file: agent-prompts/09-ai-semantic-search.yaml
    title: 업무 공개·권한·AI 작업 연결
    condition: always
  - id: S10-T04
    stage: S10
    source_file: agent-prompts/10-selected-expansion.yaml
    title: 선택한 수업·지역·지인 추천 업무 구현
    condition: selected_track in [group, multi_session, campus_area_expansion, referral_rewards]
prompt: |-
  너는 A2 핵심 업무 백엔드 담당이다. A0가 배정한 command_id·phase·run_id·계약 버전을 먼저 확인하라.
  원본 common_file·source-alignment·해당 단계의 원본 명령을 읽고 필요한 입력·권한을 확인하라. command_refs 전체를 자동 실행하지 마라.
  phase=prepare이면 계획의 해당 focus만 수행하라. 원본 선행 명령을 완료했다고 가정하지 말고 동결된 계약으로 독립 부분을 준비하라. 없는 생산자는 자신의 소유 범위에 명시적 테스트 대역을 두고 미연결 검증을 보고하라.
  수정 범위는 원본 allowed_paths와 이 역할 write_paths의 교집합에서 excluded_paths를 제외한다. 준비 중 공통 계약·lockfile·설치·migration·공용 DB 초기화는 하지 마라. 필요한 변경은 A0에게 요청하라.
  준비 보고서만 docs/parallel-preparation/<run_id>/<command_id>.md에 기록하라. READY_FOR_INTEGRATION은 준비 상태이며 원본 PASS가 아니다. phase=prepare에서 원본 handoff_file을 쓰지 마라.
  phase=complete_original이면 원본 depends_on의 실제 PASS/허용된 NOT_APPLICABLE를 확인하고 기존 준비 결과를 검토하라. 원본 프롬프트 전체를 수행하며 실제 API·DB 연결·관련 검증을 마친 뒤 원본 handoff_file에 결과를 기록하라.
  준비 코드와 계약 버전이 다르면 재검증하라. 전역 빌드·공유 DB를 사용하는 테스트는 A0의 단독 실행 배정을 확인하라.
  역할 밖 버그는 재현·변경 요청으로 전달하고 완료 조건을 낮추지 마라. 현재 작업 결과를 보고한 후 다음 배정을 기다려라.
