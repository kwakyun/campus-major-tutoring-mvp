# 에이전트에게 전달할 계획된 명령 프롬프트입니다. 쉘 스크립트가 아닙니다.
schema_version: "1.0"
kind: agent_prompt_stage
id: S06
order: 6
title: 모의 결제·수업 완료·운영 통합
status: PLANNED
common_file: agent-prompts/00-workflow.yaml
goal: 실제 자금 이동 없이 정상·취소·분쟁·복구를 포함한 전체 흐름을 완성한다.
requires_stage_gates:
  - S05-GATE
entry_checks:
  - S05 예약·납부 의무·시간 점유가 통합 완료됨
dispatch_prompt: A0는 공통 지침과 실제 선행 결과를 확인한 후 commands.order 순서대로 한 명령씩 전달하라. 각 담당자는 자기 명령만 수행한다. 마지막 S06-GATE의 판정으로 현재 단계를 마무리한다.
commands:
  - id: S06-T01
    order: 1
    agent: A1
    title: 거래·원장·운영·이벤트 스키마
    status: PLANNED
    depends_on:
      - S05-GATE
    condition: always
    prompt: |-
      너는 전공한시간의 A1 아키텍처·DB·API 계약 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      결제 시도·배분·환불·보증금 처분·정산·원장·완료 확인·후기·신고·분쟁·감사·outbox·멱등키·웹훅 스키마를 적용하라.
      추천 요청·실제 노출·업무 이벤트의 관계를 반영하고 중복 키와 금액 제약을 검증하라.
      학습 완료 결과·목표 달성 응답·다음 단계·교육자 정산 만족도·재예약 원본 참조·유입 귀속·매칭 실패·운영 처리 시간의 계약과 migration을 반영하라. 실제 거래와 모의 거래의 구분을 이벤트와 집계 경로에 유지하라.
    allowed_paths:
      - db/**
      - packages/contracts/**
      - docs/architecture/**
      - docs/handoffs/S06-T01.md
    expected_outputs:
      - db/migrations/
      - packages/contracts/events.yaml
      - docs/architecture/transaction-migration.md
    acceptance_criteria:
      - 납부·예약·수업·환불·정산 상태가 독립적으로 표현됨
      - 원장·이벤트 중복 처리 제약이 있음
      - 재이용·품질·채널 분석에 필요한 데이터와 조회 권한이 계약과 일치함
    handoff_file: docs/handoffs/S06-T01.md
    source_requirements:
      - SRC-04
      - SRC-05
      - SRC-06
  - id: S06-T02
    order: 2
    agent: A4
    title: 모의 결제·원장·반환·정산
    status: PLANNED
    depends_on:
      - S06-T01
    condition: always
    prompt: |-
      너는 전공한시간의 A4 결제·보증금·정산 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      FakePaymentGateway와 납부·환불·보증금 반환/보상·정산 작업을 구현하라.
      성공·실패·UNKNOWN·중복·지연을 재현하고 같은 거래를 한 번만 원장에 반영하라.
      수업료·보증금·수수료·교육자 지급채무·피해자 보상을 분리하며 분쟁 잠금 계약을 제공하라.
      최종 합의가·수수료·환불 조정·보증금·PG 비용을 분리해 모의 손익 대사 입력을 제공하라. 손익 예시와 실제 원장 금액은 섞지 말고 과세·공제 가정별 계산을 구분하라.
    allowed_paths:
      - apps/api/src/modules/billing/**
      - packages/domain/money/**
      - docs/payments/**
      - docs/handoffs/S06-T02.md
    expected_outputs:
      - apps/api/src/modules/billing/
      - docs/payments/mock-scenarios.md
    acceptance_criteria:
      - 중복 시도에서 금액이 중복 처리되지 않음
      - 반환·보상 합계가 보증금 잔액을 넘지 않음
      - 보증금 반환을 매출·비용으로 중복 산입하지 않고 예시 손익이 재현됨
    handoff_file: docs/handoffs/S06-T02.md
    source_requirements:
      - SRC-06
  - id: S06-T03
    order: 3
    agent: A2
    title: 수업 완료·취소·신고·작업 처리
    status: PLANNED
    depends_on:
      - S06-T02
    condition: always
    prompt: |-
      너는 전공한시간의 A2 핵심 업무 백엔드 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      Billing 결과를 검증해 필요한 납부 의무가 모두 충족될 때 예약을 확정하라.
      완료 확인·미응답·후기·취소 요청·신고·차단·분쟁 결정과 감사 기록을 구현하라.
      outbox·작업 선점·lease·재시도·만료를 연결하고 금융 핸들러는 Billing의 공개 계약을 사용하라.
      분쟁 접수와 관련 지급 보류를 같은 상태 검증·잠금 규칙으로 연결하라.
      실제 완료한 참여자만 후기를 작성하게 하고 학습 목표 대비 완료 결과·자기평가·다음 단계를 권한에 따라 기록하라. 공개 결과물은 별도 공개 동의를 확인하라.
      동일 교육자 재예약은 이전 예약을 참조한 새 요청으로 시작하고 최신 시간·가격·양측 동의를 검증하며 자동 청구하지 마라.
      교육자 본인의 주제·인정 시간·완료 횟수·후기 기반 활동 보고서 API를 제공하라. 공인 자격·취업 보장으로 표현하지 마라. 운영자의 매칭 보조·불만 원인·처리 시간과 정산 만족도 응답을 기록하라.
    allowed_paths:
      - apps/api/src/** (billing 및 recommendations 제외)
      - apps/worker/src/**
      - docs/backend/**
      - docs/handoffs/S06-T03.md
    expected_outputs:
      - apps/api/src/modules/trust/
      - apps/api/src/modules/booking/
      - docs/backend/operations-flow.md
    acceptance_criteria:
      - 한쪽 버튼이나 시간 경과만으로 자동 정산하지 않음
      - 완료된 참여자만 후기를 작성할 수 있음
      - 완료자 후기·결과 접근·새 합의 재예약·근거 기반 교육 활동 집계가 동작함
    handoff_file: docs/handoffs/S06-T03.md
    source_requirements:
      - SRC-02
      - SRC-04
      - SRC-05
  - id: S06-T04
    order: 4
    agent: A3
    title: 전체 사용자·운영자 화면
    status: PLANNED
    depends_on:
      - S06-T03
    condition: always
    prompt: |-
      너는 전공한시간의 A3 UX·프론트엔드 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      모의 결제·한쪽 미납·완료·취소·후기와 운영자 심사·매칭·분쟁·거래 대기 화면을 연결하라.
      금액 항목과 모의 데이터 표시를 유지하고 환불 요청 접수와 실제 반환 성공을 구분하라.
      작업 실패를 운영자가 확인할 수 있도록 오류·상태·재처리 결과를 표시하라.
      수업 전 목표와 완료 결과·다음 학습 단계·같은 교육자 재예약을 연결하라. 커리큘럼 재사용·일정 관리·교육 활동 보고서를 제공하고 학습 결과 공개 범위·자기보고·표본 수를 표시하라.
    allowed_paths:
      - apps/web/**
      - packages/ui/**
      - docs/ux/**
      - docs/handoffs/S06-T04.md
    expected_outputs:
      - apps/web/
      - docs/ux/full-demo-check.md
    acceptance_criteria:
      - 정상·취소·분쟁을 끝까지 시연할 수 있음
      - 모의 거래가 실제 결제로 표시되지 않음
      - 학습 전후 기록과 재예약·교육 활동 화면이 실제 API에 연결됨
    handoff_file: docs/handoffs/S06-T04.md
    source_requirements:
      - SRC-02
      - SRC-04
      - SRC-05
  - id: S06-T05
    order: 5
    agent: A5
    title: 추천에서 완료까지 이벤트 검증
    status: PLANNED
    depends_on:
      - S06-T04
    condition: always
    prompt: |-
      너는 전공한시간의 A5 AI·추천·데이터 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      서버 업무 이벤트와 실제 노출 이벤트를 request_id로 연결하고 전환·완료·취소의 분석을 구현하라.
      클라이언트 결제 완료 신호를 실제 결제로 취급하지 말고 데모 데이터를 실제 지표에서 제외하라.
      AI 도입 전 비교할 기본 추천의 평가 질의와 기준을 준비하라.
      지표 계약대로 고객군·채널별 전환, 시간/가격/수준/품질 이탈, 목표 달성·정산 만족도·수동 처리 시간과 재예약을 집계하라. 모의 데이터에서 중복 이벤트·환불·그룹 시간 환산·관찰 미완료·분모 0 사례를 검증하라.
      분석 구현은 소유한 recommendations 분석 영역과 docs/ai 안에서 수행하고 공통 이벤트·업무 저장 변경은 A1/A2에게 요청하라. CAC의 귀속 기간과 비용 포함 범위를 명시하라.
    allowed_paths:
      - apps/api/src/modules/recommendations/**
      - docs/ai/**
      - docs/handoffs/S06-T05.md
    expected_outputs:
      - docs/ai/baseline-evaluation.md
      - docs/ai/event-quality.md
      - docs/ai/pilot-metrics.md
    acceptance_criteria:
      - 반환된 카드와 실제 노출이 구분됨
      - 분자·분모와 유입 경로를 추적할 수 있음
      - 예시 집계가 계약과 일치하며 데모 지표를 실제 수익·학습 효과로 보고하지 않음
    handoff_file: docs/handoffs/S06-T05.md
    source_requirements:
      - SRC-05
      - SRC-06
      - SRC-07
  - id: S06-T06
    order: 6
    agent: A7
    title: 작업 실행·로그·중단 복구 환경
    status: PLANNED
    depends_on:
      - S06-T05
    condition: always
    prompt: |-
      너는 전공한시간의 A7 개발 기반·배포·운영 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      작업 스케줄러 인증·실행 한도·로그·실패 알림과 모의 환경 설정을 구성하라.
      worker 중단·재시작과 lease 만료 복구를 재현할 절차를 제공하라.
      의존성 요청과 공유 lockfile을 순서대로 통합하고 앱 담당자의 업무 코드 소유권을 유지하라.
    allowed_paths:
      - infra/**
      - scripts/**
      - .github/workflows/**
      - pnpm-lock.yaml
      - package.json
      - docs/operations/**
      - docs/handoffs/S06-T06.md
    expected_outputs:
      - docs/operations/jobs-and-recovery.md
      - infra/
    acceptance_criteria:
      - 중단된 작업의 재처리 절차가 재현됨
      - 테스트와 운영 키·DB가 분리됨
    handoff_file: docs/handoffs/S06-T06.md
  - id: S06-T07
    order: 7
    agent: A6
    title: 전체 모의 MVP 검증
    status: PLANNED
    depends_on:
      - S06-T06
    condition: always
    prompt: |-
      너는 전공한시간의 A6 QA·품질 검증 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      학습자·교육자·운영자 역할로 탐색→협의→납부→완료→후기를 검증하라.
      한쪽 미납·예약 만료·늦은 성공·분쟁 중 지급·환불 응답 유실·작업 종료를 검증하라.
      모의 15000원 거래에서 수수료·정산·양측 보증금 반환 금액을 대조하라.
      타인 결과 조회·완료 전 후기·무동의 공개·재예약 자동 결제·과거 커리큘럼 변경을 검증하라. 학습자 수강 건수와 시간 단위, 환불·중복·30일 미관찰·분모 0 사례의 기대값을 독립 계산하라.
    allowed_paths:
      - tests/**
      - docs/qa/**
      - docs/handoffs/S06-T07.md
    expected_outputs:
      - docs/qa/S06-integrated-demo.md
      - tests/integration/
      - tests/e2e/
    acceptance_criteria:
      - 정상 경로와 중요한 실패 경로가 통합 환경에서 통과함
      - 실제 유료 운영 준비 완료와 구분해 보고함
      - 재이용·품질·분석 경계 사례를 포함한 모의 MVP가 검증됨
    handoff_file: docs/handoffs/S06-T07.md
    source_requirements:
      - SRC-02
      - SRC-04
      - SRC-05
      - SRC-06
  - id: S06-GATE
    order: 8
    agent: A0
    title: 6단계 통합 검증과 완료 판정
    status: PLANNED
    depends_on:
      - S06-T01
      - S06-T02
      - S06-T03
      - S06-T04
      - S06-T05
      - S06-T06
      - S06-T07
    condition: always
    prompt: |-
      너는 A0 총괄·통합 담당이다.
      이 단계의 모든 명령 보고와 QA 결과를 확인하고 exit_criteria를 기준으로 통합 버전을 판정하라.
      실패·미검증·외부 의존은 숨기지 말고 소유자에게 보완 작업을 배분하라. 필요한 보완이 완료되면 동일 기준으로 재검증하라.
      완료되지 않은 필수 명령을 임의로 건너뛰지 마라.
      통합 완료 여부와 근거·남은 사항·다음 실행 가능 명령을 기록하라. 다음 단계는 자동 실행하지 마라.
      첨부 문서 반영 사항도 source_requirements 및 agent-prompts/source-alignment.md에 연결해 검증하라.
    allowed_paths:
      - docs/tasks/index.md
      - docs/decisions/**
      - docs/releases/**
      - docs/handoffs/S06-GATE.md
    expected_outputs:
      - docs/releases/S06-gate.md
      - docs/tasks/index.md
    acceptance_criteria:
      - 양측 납부→예약 확정→완료→반환·정산 흐름이 모의 환경에서 검증됨
      - 취소·분쟁·작업 중단과 추천 전환 기록을 운영자가 확인할 수 있음
      - 목표·완료 결과·교육 활동·재예약과 파일럿 지표를 모의 데이터로 검증함
    handoff_file: docs/handoffs/S06-GATE.md
exit_criteria:
  - 양측 납부→예약 확정→완료→반환·정산 흐름이 모의 환경에서 검증됨
  - 취소·분쟁·작업 중단과 추천 전환 기록을 운영자가 확인할 수 있음
  - 목표·완료 결과·교육 활동·재예약과 파일럿 지표를 모의 데이터로 검증함
