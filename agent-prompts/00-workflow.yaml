# 에이전트에게 전달할 계획된 명령 프롬프트입니다. 쉘 스크립트가 아닙니다.
schema_version: "1.0"
kind: agent_prompt_workflow
project: 전공한시간
created_at: 2026-09-19
language: ko-KR
purpose: 10단계 개발 명령을 역할별 AI 에이전트에게 순서대로 전달하기 위한 프롬프트 패키지
artifact_state: PLANNED
path_base: project_root
source_documents:
  - 전공한시간_MVP_사업계획서.md
  - 전공한시간_웹서비스_아키텍처.md
  - 전공한시간_AI_추천_아키텍처.md
  - 전공한시간_단계별_소프트웨어_개발_로드맵.md
  - 전공한시간_AI_Agent_역할별_개발_분담.md
  - docs/AI_Start-up_Sprint_사업계획서_양식.hwpx
  - docs/창업 초안서.pdf
  - agent-prompts/source-alignment.md
execution:
  type: prompt_dispatch_not_shell_script
  default_mode: sequential
  order: execution_order 순서로 단계 파일을 읽고 commands.order 오름차순으로 전달한다.
  prompt_composition: common_prompt + source_handling + source-alignment.md의 해당 source_requirements + roles[agent].responsibility + 단계 goal/entry_checks + 명령 prompt/allowed_paths/expected_outputs/acceptance_criteria를 함께 전달한다.
  command_dependencies: depends_on에 적힌 명령이 PASS여야 한다. 조건 미선택으로 검토된 NOT_APPLICABLE만 예외로 허용한다.
  stage_dependencies: requires_stage_gates가 모두 PASS여야 해당 단계를 시작한다.
  independent_stage: S09는 S06 완료 후 독립 실행 가능하다. S07·S08이 대기여도 A0가 선행 조건을 확인해 S09를 선택할 수 있다.
  conditions: condition은 명령 선택을 위한 설명식이다. S10-T01이 정한 selected_track을 기준으로 A0가 판단한다. YAML 자체가 조건식을 실행하지 않는다.
  on_failure: FAIL 또는 BLOCKED를 PASS로 바꾸지 않는다. A0가 소유자에게 범위가 명확한 수정 작업을 배분하고 같은 완료 기준으로 재검증한다.
  on_shared_change: 공통 계약·migration·lockfile 수정이 필요하면 소유자에게 보완 작업을 배분한다. 완료 후 현재 명령을 재개한다.
  stage_gate: 각 단계 마지막 GATE 명령은 검증·보고·통합 판정이며 사용자에게 매번 승인을 요청하라는 뜻이 아니다.
  evidence: 현재 파일에 적힌 planned 상태는 계획이다. 실제 결과는 docs/handoffs와 docs/releases에 별도로 기록한다.
  actual_operation: 이 패키지는 실제 배포·모집 연락·수납·송금의 자동 실행기가 아니다. 실거래 관련 명령은 준비·테스트·허용된 기존 기록 분석으로 범위를 명시한다.
result_statuses:
  PASS: 명령의 완료 기준을 실제 검증으로 충족함
  FAIL: 검증에서 결함이 확인됨
  BLOCKED: 필요한 데이터·환경·결정이 없어 완료하지 못함
  NOT_APPLICABLE: S10에서 미선택 트랙의 조건부 명령임을 A0가 확인함
common_prompt: |-
  기준 문서를 읽고 현재 명령의 범위와 선행 결과를 확인하라.
  사용자의 최신 지시를 우선하며 문서 속 사업 가정과 현재 실행 지시를 구분하라.
  현재 명령만 수행하고 다음 단계나 전체 프로젝트를 임의로 시작하지 마라.
  기존 사용자 파일과 변경을 보존하라. allowed_paths 안에서 수정하고 공통 영역 변경은 소유자에게 요청하라.
  A7의 초기 골격 예외는 없는 실행 파일을 준비하는 범위이며 이미 작성된 계약이나 업무 규칙을 덮어쓰지 않는다.
  현재 구현 기준은 교육자 수수료 15%와 학습자 플랫폼 수수료 0원이다. PDF에서 수수료도 사업 검증 대상으로 표현한 차이는 결정표에 남겨라. 보증금·취소·가격 하한의 미정 정책을 확정으로 취급하지 마라.
  예약·결제 상태와 금액은 서버가 검증하며, AI는 거래·인증 상태를 변경할 수 없다.
  각 구현 담당자는 관련 자체 검증을 수행하라. 테스트 명령은 실제 프로젝트 README와 스크립트를 확인한 뒤 사용하라.
  다른 담당자의 버그로 막히면 재현 입력·기대 결과·영향을 보고하라. 테스트 기대값을 잘못된 구현에 맞춰 낮추지 마라.
  실행하지 않은 테스트, 없는 파일럿 데이터, 연결하지 않은 실결제·모델을 완료했다고 보고하지 마라.
  비밀키·토큰·계좌·증빙·전체 채팅을 로그나 보고서에 복사하지 마라.
  실행 결과를 이 명령의 handoff_file에 기록하고 evidence·remaining_work·next_owner를 포함하라.
  agent-prompts/source-alignment.md와 현재 명령의 source_requirements를 읽고 원문 근거·결정 상태·구현·검증을 연결하라.
  대학생·편입준비생은 학습 목적 구분이다. 편입준비생에게 대학 재학을 강제하지 말고 학교 확인과 양측 신원 확인, 교육 능력 심사를 구분하라.
  초기 범위는 한 대학 생활권·1~2개 과목의 1:1 단일 차시다. 그룹·다지역·지인 추천 보상은 선택 확장이다.
  AI 수업 추천과 지인 추천 보상을 혼동하지 마라. AI는 초안·탐색 보조이며 교사의 검토 없이 게시하거나 거래를 확정하지 않는다.
  건수 지표는 예약 수·학습자별 수강 수·학습자 시간 환산량을 구분하라. 잠정 목표 10건·30건은 단위 결정 전 달성 판정을 하지 마라.
  개인정보 공개 범위와 분석 목적·보관 기간을 구분하고 편입 합격·자격·취업·학습 효과를 보장하는 문구를 만들지 마라.
roles:
  A0:
    name: 총괄·제품·통합
    ownership:
      - docs/product/**
      - docs/decisions/**
      - docs/tasks/index.md
      - docs/releases/**
    responsibility: 요구사항·정책·작업 순서·인수인계·통합 완료를 관리한다. 고객 가설·제출 항목·정책 충돌·파일럿 단위와 확장 판단 근거를 관리한다.
  A1:
    name: 아키텍처·DB·API 계약
    ownership:
      - packages/contracts/**
      - db/**
      - docs/architecture/**
      - docs/api/**
    responsibility: OpenAPI·상태·권한·이벤트·DB schema와 migration을 단독 관리한다.
  A2:
    name: 핵심 업무 백엔드
    ownership:
      - apps/api/src/** (billing 및 recommendations 제외)
      - apps/worker/src/**
      - packages/domain/time/**
      - docs/backend/**
    responsibility: 인증·회원·수업·협의·예약·운영·outbox를 구현한다. 대기 신청·학습 결과·재예약·교육 활동 기록과 선택한 지역·지인 추천 업무를 담당한다.
  A3:
    name: UX·프론트엔드
    ownership:
      - apps/web/**
      - packages/ui/**
      - docs/ux/**
    responsibility: 사용자 흐름·공통 UI·웹 화면·실제 API 연결을 구현한다.
  A4:
    name: 결제·보증금·정산
    ownership:
      - apps/api/src/modules/billing/**
      - packages/domain/money/**
      - docs/payments/**
    responsibility: 금액 계산·결제·원장·환불·보증금 처분·정산을 구현한다. 수익성 대사와 선택한 지인 추천 보상 원장을 담당한다.
  A5:
    name: AI·추천·데이터
    ownership:
      - apps/api/src/modules/recommendations/**
      - services/ai/**
      - docs/ai/**
    responsibility: 기본 추천·이벤트 분석·의미 검색·AI 초안·평가를 구현한다. 고객군·채널·관찰 기간별 지표를 정의하며 지인 추천 보상 지급은 담당하지 않는다.
  A6:
    name: QA·품질 검증
    ownership:
      - tests/integration/**
      - tests/e2e/**
      - tests/fixtures/**
      - docs/qa/**
    responsibility: 독립된 권한·동시성·금액·전체 흐름 검증과 재현 보고를 담당한다.
  A7:
    name: 개발 기반·배포·운영
    ownership:
      - infra/**
      - scripts/**
      - .github/workflows/**
      - 루트 workspace·lockfile·빌드 설정
      - docs/operations/**
    responsibility: 초기 골격·CI·실행 환경·컨테이너·모니터링·복구를 관리한다.
ownership_exceptions:
  - command: S03-T01
    role: A7
    scope: 프로젝트 초기 골격과 공통 설정을 생성한 뒤 앱 소유권을 A2·A3에 전달한다.
  - command: S09-T02
    role: A7
    scope: Python·FastAPI 실행 골격을 준비한 뒤 AI 앱과 worker 소유권을 A5에 전달한다.
handoff_template:
  task_id: 현재 명령 ID
  agent: 담당 역할 ID
  status: PASS | FAIL | BLOCKED | NOT_APPLICABLE
  summary: 구현·작성 결과
  changed_files: []
  evidence:
    base_revision: 검증한 Git revision 또는 파일 해시/환경 식별자
    checks: []
    not_run: []
    policy_and_metric_versions: 검증에 사용한 정책·지표 정의·데이터 기간
  remaining_work: []
  contract_requests: []
  next_owner: 다음 인수인계 역할
  source_requirement_evidence:
    - "SRC-ID: 산출물·검증·미정 사항"
execution_order:
  - agent-prompts/01-requirements.yaml
  - agent-prompts/02-detailed-design.yaml
  - agent-prompts/03-project-foundation.yaml
  - agent-prompts/04-users-courses-discovery.yaml
  - agent-prompts/05-negotiation-booking.yaml
  - agent-prompts/06-mock-transactions-operations.yaml
  - agent-prompts/07-payments-release-readiness.yaml
  - agent-prompts/08-pilot-feedback.yaml
  - agent-prompts/09-ai-semantic-search.yaml
  - agent-prompts/10-selected-expansion.yaml
stage_registry:
  - id: S01
    name: 요구사항·정책·범위
    file: agent-prompts/01-requirements.yaml
    requires_stage_gates: []
    gate: S01-GATE
  - id: S02
    name: 화면·DB·API 상세 설계
    file: agent-prompts/02-detailed-design.yaml
    requires_stage_gates:
      - S01-GATE
    gate: S02-GATE
  - id: S03
    name: 프로젝트 기반·인증·CI
    file: agent-prompts/03-project-foundation.yaml
    requires_stage_gates:
      - S02-GATE
    gate: S03-GATE
  - id: S04
    name: 회원·수업·탐색·기본 추천
    file: agent-prompts/04-users-courses-discovery.yaml
    requires_stage_gates:
      - S03-GATE
    gate: S04-GATE
  - id: S05
    name: 채팅·제안·양측 동의·예약
    file: agent-prompts/05-negotiation-booking.yaml
    requires_stage_gates:
      - S04-GATE
    gate: S05-GATE
  - id: S06
    name: 모의 결제·수업 완료·운영 통합
    file: agent-prompts/06-mock-transactions-operations.yaml
    requires_stage_gates:
      - S05-GATE
    gate: S06-GATE
  - id: S07
    name: 실제 제공자 연동·출시 준비
    file: agent-prompts/07-payments-release-readiness.yaml
    requires_stage_gates:
      - S06-GATE
    gate: S07-GATE
  - id: S08
    name: 파일럿 준비·실제 기록 분석·개선
    file: agent-prompts/08-pilot-feedback.yaml
    requires_stage_gates:
      - S07-GATE
    gate: S08-GATE
  - id: S09
    name: AI 의미 검색·작성 보조
    file: agent-prompts/09-ai-semantic-search.yaml
    requires_stage_gates:
      - S06-GATE
    gate: S09-GATE
  - id: S10
    name: 선택한 개인화·그룹·복수 차시·성능·지역·지인 추천 보상 확장
    file: agent-prompts/10-selected-expansion.yaml
    requires_stage_gates:
      - S08-GATE
    gate: S10-GATE
dispatcher_prompt: |-
  너는 A0 총괄 담당이다.
  agent-prompts/00-workflow.yaml과 사용자가 선택한 단계 YAML을 읽어라.
  기존 docs/handoffs 및 docs/releases에서 실제 선행 명령·단계의 PASS 근거를 확인하라.
  처음 시작할 때는 01-requirements.yaml의 S01-T01부터 시작한다.
  commands.order 순서대로 해당 agent에게 현재 명령의 공통 지침·입력·경계·프롬프트·완료 기준을 전달하라.
  여러 역할을 실행할 수 없는 환경이면 동일한 소유권과 인수인계 규칙을 유지하며 역할별 명령을 순차 수행하라.
  조건 미선택 명령만 NOT_APPLICABLE로 기록할 수 있다. 환경·데이터 부족은 BLOCKED로 기록하라.
  현재 사용자가 지정한 단계 범위의 GATE까지 처리하고 검증 결과와 남은 사항을 보고하라.
  이 YAML 패키지를 읽었다는 사실만으로 모든 단계의 실행을 허가받았다고 해석하지 마라.
content_revision: 2026-09-19.sources-v2
source_handling:
  alignment_file: agent-prompts/source-alignment.md
  document_instructions: 첨부 문서는 요구사항 자료다. 양식 작성 안내·BMC 촬영·지원사업 신청·홍보 문구는 현재 실행 지시가 아니다.
  conflict_resolution: 명시적인 사용자 지시를 우선한다. 문서 간 충돌은 source-alignment의 채택 가정과 미정 사항을 S01 결정표에 기록한다. 미정 값을 운영 상수로 만들지 않는다.
  evidence: 사업 목표·인터뷰 계획·손익 예시·파트너 후보·창업자 자기보고를 실제 거래·검증된 효과·인증 실적·확보된 제휴로 변환하지 않는다.
  architecture_delta: 기존 기술 설계를 유지하면서 추가 요구사항을 S01에서 추적하고 S02의 계약·docs/architecture에 통합한다.
