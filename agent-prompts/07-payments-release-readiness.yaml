# 에이전트에게 전달할 계획된 명령 프롬프트입니다. 쉘 스크립트가 아닙니다.
schema_version: "1.0"
kind: agent_prompt_stage
id: S07
order: 7
title: 실제 제공자 연동·출시 준비
status: PLANNED
common_file: agent-prompts/00-workflow.yaml
goal: 제공자 테스트 환경에서 거래 연동·복구를 검증하고 실거래 준비 조건을 확인한다.
requires_stage_gates:
  - S06-GATE
entry_checks:
  - S06 모의 거래·원장·운영 흐름이 검증됨
  - 결제·보증금·지급 지원 범위와 정책의 확인 상태를 기록할 수 있음
dispatch_prompt: A0는 공통 지침과 실제 선행 결과를 확인한 후 commands.order 순서대로 한 명령씩 전달하라. 각 담당자는 자기 명령만 수행한다. 마지막 S07-GATE의 판정으로 현재 단계를 마무리한다.
commands:
  - id: S07-T01
    order: 1
    agent: A0
    title: 실거래 진입 조건 확인
    status: PLANNED
    depends_on:
      - S06-GATE
    condition: always
    prompt: |-
      너는 전공한시간의 A0 총괄·제품·통합 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      정책 결정표와 제공자 계약·지원 범위·인증 방식·운영 담당 정보의 실제 준비 상태를 확인하라.
      실제 보증금 수납·반환·상대방 보상·교육자 지급 방식이 확인됐는지 구분하라.
      없는 정보는 외부 의존으로 기록하고 가능한 테스트 작업과 현재 실행할 수 없는 작업을 나눠라. 문서 작성만으로 실결제를 활성화하지 마라.
      운영 전 미정 보증금·취소·가격 하한·완료 미응답 정책을 결정표와 대조하라. 교육자 커리큘럼·샘플 설명·가능 시간·정산 안내 확인 절차를 준비하라.
      실제 PG 요율·운영 비용·원문 손익 가정을 대조하고 확인되지 않은 세무 조건은 미확인으로 남겨라. 실제 적용이 필요한 규정은 공식 근거로 확인하라.
      공간·대학·에브리타임·지원사업은 제휴·자금이 확보되었다는 증거가 없으면 외부 의존 또는 계획으로 남기고 MVP 필수 연동에서 제외하라.
    allowed_paths:
      - docs/product/**
      - docs/decisions/**
      - docs/releases/**
      - docs/handoffs/S07-T01.md
    expected_outputs:
      - docs/releases/payment-entry-check.md
    acceptance_criteria:
      - 실제 확인한 사실과 미정 사항이 분리됨
      - 모의 정책으로 실제 자금을 처리하지 않음
      - 실거래 정책·공급 품질·실제 비용의 준비 여부가 증거와 연결되며 제휴가 전제되지 않음
    handoff_file: docs/handoffs/S07-T01.md
    source_requirements:
      - SRC-02
      - SRC-06
      - SRC-07
      - SRC-11
      - SRC-12
  - id: S07-T02
    order: 2
    agent: A4
    title: 결제 제공자 테스트 연동
    status: PLANNED
    depends_on:
      - S07-T01
    condition: always
    prompt: |-
      너는 전공한시간의 A4 결제·보증금·정산 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      확인된 제공자 사양과 계약 범위에 맞춰 승인·조회·취소·환불·보증금·지급 Adapter를 구현하라.
      저장된 주문·금액과 납부자를 검증하고 이벤트 종류별 검증·멱등키·상태 대사로 중복·순서 역전·UNKNOWN을 처리하라.
      테스트 환경에서 검증하되 제공자 미지원 기능이나 실환경 전용 절차는 분리해 보고하라.
      이번 명령만으로 실제 수납·송금 또는 실결제 활성화를 수행하지 마라.
    allowed_paths:
      - apps/api/src/modules/billing/**
      - packages/domain/money/**
      - docs/payments/**
      - docs/handoffs/S07-T02.md
    expected_outputs:
      - apps/api/src/modules/billing/
      - docs/payments/provider-integration.md
      - docs/payments/reconciliation.md
    acceptance_criteria:
      - 클라이언트 금액이나 성공 리다이렉트만으로 승인하지 않음
      - 환불·지급 재시도와 대사 근거가 있음
    handoff_file: docs/handoffs/S07-T02.md
  - id: S07-T03
    order: 3
    agent: A2
    title: 실제 거래 상태와 예약·분쟁 연결
    status: PLANNED
    depends_on:
      - S07-T02
    condition: always
    prompt: |-
      너는 전공한시간의 A2 핵심 업무 백엔드 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      제공자 결과를 Booking·운영 상태에 연결하라.
      한쪽만 납부, 만료 후 늦은 성공, 취소와 승인 경쟁, 분쟁과 지급 경쟁을 처리하라.
      증빙 접근·보관·삭제·차단·감사 기록을 확인하고 허용된 운영 API로만 재처리하게 하라.
    allowed_paths:
      - apps/api/src/** (billing 및 recommendations 제외)
      - apps/worker/src/**
      - docs/backend/**
      - docs/handoffs/S07-T03.md
    expected_outputs:
      - docs/backend/production-state-check.md
      - apps/api/src/modules/booking/
    acceptance_criteria:
      - 확정 조건 미충족 예약이 확정되지 않음
      - 분쟁 중 관련 자금 처분과 권한을 검사함
    handoff_file: docs/handoffs/S07-T03.md
  - id: S07-T04
    order: 4
    agent: A3
    title: 제공자 결제와 실패 화면 연결
    status: PLANNED
    depends_on:
      - S07-T03
    condition: always
    prompt: |-
      너는 전공한시간의 A3 UX·프론트엔드 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      결제창·인증 후 복귀·서버 확인·결과 불명·환불 대기·지급 실패 화면을 연결하라.
      브라우저 새로고침·중복 클릭·뒤로가기에도 실제 서버 상태를 표시하라.
      모의 모드와 테스트·운영 모드 표시 및 결제 금액 명세를 확인하라.
    allowed_paths:
      - apps/web/**
      - packages/ui/**
      - docs/ux/**
      - docs/handoffs/S07-T04.md
    expected_outputs:
      - docs/ux/payment-integration-check.md
      - apps/web/
    acceptance_criteria:
      - 화면 성공 표시가 서버 승인 결과와 일치함
      - 결과 불명 상태에서 새 청구를 유도하지 않음
    handoff_file: docs/handoffs/S07-T04.md
  - id: S07-T05
    order: 5
    agent: A7
    title: 출시 환경·대사·복원 준비
    status: PLANNED
    depends_on:
      - S07-T04
    condition: always
    prompt: |-
      너는 전공한시간의 A7 개발 기반·배포·운영 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      운영과 테스트의 설정·자격증명·DB·예시 데이터를 분리하고 배포·작업 인증·대사·실패 알림을 구성하라.
      스테이징에서 백업 복원·작업 복구·배포 복구를 시험하라.
      공급자 테스트로 확인할 수 없는 실환경 의존을 기록하라. 현재 위임 범위 밖의 운영 배포나 자금 이동을 자동 수행하지 마라.
      파일럿 운영 한도·월 실행 비용·수동 처리 기록·실제와 테스트 지표 분리 상태를 점검하라. 지원금 미확보 상태에서도 축소된 운영안을 실행할 수 있게 준비하라.
    allowed_paths:
      - infra/**
      - scripts/**
      - .github/workflows/**
      - docs/operations/**
      - pnpm-lock.yaml
      - docs/handoffs/S07-T05.md
    expected_outputs:
      - docs/operations/release-runbook.md
      - docs/operations/restore-check.md
    acceptance_criteria:
      - 복원·복구 결과와 남은 운영 의존이 명시됨
      - 비밀값과 예시 데이터가 운영 경계에서 보호됨
      - 환경 비용과 파일럿 운영 한도가 기록됨
    handoff_file: docs/handoffs/S07-T05.md
    source_requirements:
      - SRC-06
      - SRC-07
  - id: S07-T06
    order: 6
    agent: A6
    title: 거래·권한·복구 독립 검증
    status: PLANNED
    depends_on:
      - S07-T05
    condition: always
    prompt: |-
      너는 전공한시간의 A6 QA·품질 검증 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      통합 버전에서 중복 승인·웹훅·환불·지급, 금액 조작, 응답 유실, 분쟁 동시 처리와 권한 경계를 검증하라.
      내부 원장과 제공자 테스트 내역을 대조하라.
      실제 검증·테스트 대역·실환경 미검증을 구분하고 출시를 막는 결함을 보고하라.
      신원 증빙·학습 결과·운영 분석 데이터의 접근 권한과 로그 노출을 검증하고 테스트 거래가 실제 성과 집계에 포함되지 않는지 확인하라.
    allowed_paths:
      - tests/**
      - docs/qa/**
      - docs/handoffs/S07-T06.md
    expected_outputs:
      - docs/qa/S07-release-readiness.md
    acceptance_criteria:
      - 중복 자금 처리와 부적절한 상태 전이가 발견되지 않음
      - 검증 범위와 실제 운영 미확인 부분을 구분함
      - 민감 데이터와 실제 지표의 환경 경계가 검증됨
    handoff_file: docs/handoffs/S07-T06.md
    source_requirements:
      - SRC-02
      - SRC-05
      - SRC-06
  - id: S07-GATE
    order: 7
    agent: A0
    title: 7단계 통합 검증과 완료 판정
    status: PLANNED
    depends_on:
      - S07-T01
      - S07-T02
      - S07-T03
      - S07-T04
      - S07-T05
      - S07-T06
    condition: always
    prompt: |-
      너는 A0 총괄·통합 담당이다.
      이 단계의 모든 명령 보고와 QA 결과를 확인하고 exit_criteria를 기준으로 통합 버전을 판정하라.
      실패·미검증·외부 의존은 숨기지 말고 소유자에게 보완 작업을 배분하라. 필요한 보완이 완료되면 동일 기준으로 재검증하라.
      완료되지 않은 필수 명령을 임의로 건너뛰지 마라.
      실결제 활성화·송금·공개 배포는 수행하지 말고 실제 준비 상태만 보고하라.
      통합 완료 여부와 근거·남은 사항·다음 실행 가능 명령을 기록하라. 다음 단계는 자동 실행하지 마라.
      첨부 문서 반영 사항도 source_requirements 및 agent-prompts/source-alignment.md에 연결해 검증하라.
    allowed_paths:
      - docs/tasks/index.md
      - docs/decisions/**
      - docs/releases/**
      - docs/handoffs/S07-GATE.md
    expected_outputs:
      - docs/releases/S07-gate.md
      - docs/tasks/index.md
    acceptance_criteria:
      - 테스트 연동·중복·복구·대사·권한·복원 검증이 완료됨
      - 미확정 계약·정책·운영 의존이 해결되기 전 실거래 준비 완료로 판정하지 않음
      - 실제 운영 정책·공급 품질·비용·개인정보 준비 상태를 확인함
    handoff_file: docs/handoffs/S07-GATE.md
exit_criteria:
  - 테스트 연동·중복·복구·대사·권한·복원 검증이 완료됨
  - 미확정 계약·정책·운영 의존이 해결되기 전 실거래 준비 완료로 판정하지 않음
  - 실제 운영 정책·공급 품질·비용·개인정보 준비 상태를 확인함
content_revision: 2026-09-19.sources-v2
source_alignment_file: agent-prompts/source-alignment.md
