# 에이전트에게 전달할 계획된 명령 프롬프트입니다. 쉘 스크립트가 아닙니다.
schema_version: "1.0"
kind: agent_prompt_stage
id: S05
order: 5
title: 채팅·제안·양측 동의·예약
status: PLANNED
common_file: agent-prompts/00-workflow.yaml
goal: 유효한 최종안에 양측이 동의하면 중복 없이 예약과 시간 점유를 만든다.
requires_stage_gates:
  - S04-GATE
entry_checks:
  - S04 계정·수업·시간·탐색이 준비됨
dispatch_prompt: A0는 공통 지침과 실제 선행 결과를 확인한 후 commands.order 순서대로 한 명령씩 전달하라. 각 담당자는 자기 명령만 수행한다. 마지막 S05-GATE의 판정으로 현재 단계를 마무리한다.
commands:
  - id: S05-T01
    order: 1
    agent: A1
    title: 협의·예약·납부 의무 스키마 적용
    status: PLANNED
    depends_on:
      - S04-GATE
    condition: always
    prompt: |-
      너는 전공한시간의 A1 아키텍처·DB·API 계약 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      협의방·멤버·메시지·제안 버전·동의·예약·참여자·회차·시간 점유·정책·납부 의무 migration을 작성하라.
      고유 제약과 사용자별 시간 중복 배제 제약을 구현하고 적용·충돌 거절을 검증하라.
      Booking이 Billing의 납부 의무 생성 함수를 같은 트랜잭션에서 호출할 계약을 확인하라.
      합의한 단원·목표·기대 결과물·선수 수준을 제안 버전과 예약 사본에 포함하고 원본 커리큘럼 수정으로 변경되지 않게 하라.
    allowed_paths:
      - db/**
      - packages/contracts/**
      - docs/architecture/**
      - docs/handoffs/S05-T01.md
    expected_outputs:
      - db/migrations/
      - docs/architecture/booking-migration.md
    acceptance_criteria:
      - 동의·예약 중복과 시간 중복 제약이 적용됨
      - 기존 초기 데이터를 손상시키지 않음
      - 학습 범위와 결과 기준이 합의 버전에 고정됨
    handoff_file: docs/handoffs/S05-T01.md
    source_requirements:
      - SRC-03
  - id: S05-T02
    order: 2
    agent: A4
    title: 금액 계산과 납부 의무 인터페이스
    status: PLANNED
    depends_on:
      - S05-T01
    condition: always
    prompt: |-
      너는 전공한시간의 A4 결제·보증금·정산 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      최종 수업료·교육자 15% 수수료·정산 예정액·양측 보증금의 금액 명세와 납부 의무 생성 인터페이스를 구현하라.
      미정 비율은 정책 주입으로 모의 처리하고 확정 정책으로 하드코딩하지 마라.
      Booking의 트랜잭션을 전달받아 납부 의무만 생성하며 외부 PG 호출은 수행하지 마라.
    allowed_paths:
      - apps/api/src/modules/billing/**
      - packages/domain/money/**
      - docs/payments/**
      - docs/handoffs/S05-T02.md
    expected_outputs:
      - apps/api/src/modules/billing/
      - packages/domain/money/
      - docs/payments/obligations.md
    acceptance_criteria:
      - 예시 15000원 수업의 수수료 2250원·정산 예정액 12750원이 일치함
      - 보증금은 수수료 기준에 포함되지 않음
    handoff_file: docs/handoffs/S05-T02.md
  - id: S05-T03
    order: 3
    agent: A2
    title: 메시지·제안·동의·예약 구현
    status: PLANNED
    depends_on:
      - S05-T02
    condition: always
    prompt: |-
      너는 전공한시간의 A2 핵심 업무 백엔드 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      협의방 참여자 권한·텍스트 저장·제안 카드·재제안·특정 버전 수락을 구현하라.
      최종 수락에서 최신 버전과 필수 동의를 확인하고 예약 사본·회차·시간 점유·납부 의무를 원자적으로 생성하라.
      중복 수락·자기 거래·오래된 제안·시간 충돌을 차단하라.
      예약 생성 후 협의 제안을 AGREED로 닫고 조건 수정은 변경 요청 경로로 보내라.
      협의에서 학습 목표·필요 단원·실습 결과물·시간·가격을 구체화하고 어느 항목이든 변경되면 새 버전과 재동의를 요구하라. 대체 시간 제안을 수락해도 동일한 협의·예약 검증을 통과하게 하라.
    allowed_paths:
      - apps/api/src/modules/negotiation/**
      - apps/api/src/modules/booking/**
      - docs/backend/**
      - docs/handoffs/S05-T03.md
    expected_outputs:
      - apps/api/src/modules/negotiation/
      - apps/api/src/modules/booking/
      - docs/backend/booking-flow.md
    acceptance_criteria:
      - 최신 제안만 예약으로 전환됨
      - 예약 생성과 납부 의무·점유가 일관됨
      - 목표·결과물 변경에 기존 동의가 재사용되지 않음
    handoff_file: docs/handoffs/S05-T03.md
    source_requirements:
      - SRC-03
  - id: S05-T04
    order: 4
    agent: A3
    title: 협의방·최종 합의·예약 UI
    status: PLANNED
    depends_on:
      - S05-T03
    condition: always
    prompt: |-
      너는 전공한시간의 A3 UX·프론트엔드 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      채팅과 제안·재제안·수락 카드를 연결하라.
      커리큘럼·시간·장소·참여자·수업료·양측 보증금·수수료·정산 예정액·취소 조건을 같은 최종안으로 표시하라.
      오래된 제안·시간 충돌·중복 클릭·결제 대기 화면을 처리하고 합의 완료와 예약 확정을 구분하라.
      최종안에 수업 목표·선택 단원·예상 결과물을 보여주고 최초 희망가와 최종 합의가를 구분하라. 교육자의 수수료 차감 후 예상액과 반환 대상 보증금을 구분하라.
    allowed_paths:
      - apps/web/**
      - packages/ui/**
      - docs/ux/**
      - docs/handoffs/S05-T04.md
    expected_outputs:
      - apps/web/
      - docs/ux/negotiation-booking-check.md
    acceptance_criteria:
      - 두 역할로 재제안→동의→예약 상세를 시연할 수 있음
      - 기존 예약 조건을 화면에서 임의 수정하지 않음
      - 양측이 학습 범위·최종 금액·예상 정산액을 같은 버전으로 확인함
    handoff_file: docs/handoffs/S05-T04.md
    source_requirements:
      - SRC-03
      - SRC-06
  - id: S05-T05
    order: 5
    agent: A6
    title: 수락·시간·권한 동시성 검증
    status: PLANNED
    depends_on:
      - S05-T04
    condition: always
    prompt: |-
      너는 전공한시간의 A6 QA·품질 검증 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      실제 PostgreSQL에서 재제안과 수락, 중복 수락, 같은 사용자의 겹치는 시간 예약을 동시에 요청하라.
      타 협의방 접근과 예약 후 원본·정책 변경을 확인하라.
      웹의 두 역할 시나리오와 실패 안내도 검증하라.
      학습 목표나 결과물을 수정하는 동안 구버전을 수락하는 경쟁 상황과, 수업 원본 수정 후 예약 사본 불변성을 검증하라.
    allowed_paths:
      - tests/**
      - docs/qa/**
      - docs/handoffs/S05-T05.md
    expected_outputs:
      - tests/integration/
      - docs/qa/S05-booking.md
    acceptance_criteria:
      - 중복 유효 예약·시간 점유가 발생하지 않음
      - 예약 스냅샷과 양측 동의 기록이 유지됨
      - 학습 범위 변경도 가격·시간 변경과 같은 동의 규칙을 따름
    handoff_file: docs/handoffs/S05-T05.md
    source_requirements:
      - SRC-03
  - id: S05-GATE
    order: 6
    agent: A0
    title: 5단계 통합 검증과 완료 판정
    status: PLANNED
    depends_on:
      - S05-T01
      - S05-T02
      - S05-T03
      - S05-T04
      - S05-T05
    condition: always
    prompt: |-
      너는 A0 총괄·통합 담당이다.
      이 단계의 모든 명령 보고와 QA 결과를 확인하고 exit_criteria를 기준으로 통합 버전을 판정하라.
      실패·미검증·외부 의존은 숨기지 말고 소유자에게 보완 작업을 배분하라. 필요한 보완이 완료되면 동일 기준으로 재검증하라.
      완료되지 않은 필수 명령을 임의로 건너뛰지 마라.
      통합 완료 여부와 근거·남은 사항·다음 실행 가능 명령을 기록하라. 다음 단계는 자동 실행하지 마라.
      첨부 문서 반영 사항도 source_requirements 및 agent-prompts/source-alignment.md에 연결해 검증하라.
    allowed_paths:
      - docs/tasks/index.md
      - docs/decisions/**
      - docs/releases/**
      - docs/handoffs/S05-GATE.md
    expected_outputs:
      - docs/releases/S05-gate.md
      - docs/tasks/index.md
    acceptance_criteria:
      - 최신 제안 동의가 불변 예약 명세로 연결됨
      - 오래된 제안·중복 수락·시간 충돌이 차단됨
      - 금액·시간과 함께 학습 목표·단원·예상 결과물도 최종 합의 사본에 고정됨
    handoff_file: docs/handoffs/S05-GATE.md
exit_criteria:
  - 최신 제안 동의가 불변 예약 명세로 연결됨
  - 오래된 제안·중복 수락·시간 충돌이 차단됨
  - 금액·시간과 함께 학습 목표·단원·예상 결과물도 최종 합의 사본에 고정됨
