# 에이전트에게 전달할 계획된 명령 프롬프트입니다. 쉘 스크립트가 아닙니다.
schema_version: "1.0"
kind: agent_prompt_stage
id: S03
order: 3
title: 프로젝트 기반·인증·CI
status: PLANNED
common_file: agent-prompts/00-workflow.yaml
goal: 새 환경에서 재현 가능한 웹·API·DB·검증 기반을 구성한다.
requires_stage_gates:
  - S02-GATE
entry_checks:
  - S02 공통 계약이 준비됨
  - 기존 파일을 검사하여 사용자 작업을 보존할 수 있음
dispatch_prompt: A0는 공통 지침과 실제 선행 결과를 확인한 후 commands.order 순서대로 한 명령씩 전달하라. 각 담당자는 자기 명령만 수행한다. 마지막 S03-GATE의 판정으로 현재 단계를 마무리한다.
commands:
  - id: S03-T01
    order: 1
    agent: A7
    title: 프로젝트 골격과 개발 환경
    status: PLANNED
    depends_on:
      - S02-GATE
    condition: always
    prompt: |-
      너는 전공한시간의 A7 개발 기반·배포·운영 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      기존 파일을 보존하며 apps/web·apps/api·packages/contracts·packages/domain·packages/ui·db·tests 구조를 준비하라.
      workspace·lockfile·실행·빌드·형식 검사·환경변수 예시·CI를 구성하라.
      로컬과 스테이징·운영 자격증명을 분리하라. 없는 외부 자격증명은 만들어내지 말고 로컬 대체 환경과 남은 의존을 기록하라.
      이번 작업의 초기 골격 작성 후 앱 파일 소유권을 A2·A3에게 넘겨라.
      직접 제작·소규모 운영 가정에 맞춰 실행 환경별 예상 비용을 문서화하고 외부 지원금 확보나 유료 인프라 구매를 전제로 두지 마라.
    allowed_paths:
      - apps/web/**
      - apps/api/**
      - packages/**
      - db/**
      - tests/**
      - infra/**
      - scripts/**
      - .github/workflows/**
      - README.md
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - tsconfig*.json
      - .gitignore
      - .env.example
      - docs/operations/**
      - docs/handoffs/S03-T01.md
    expected_outputs:
      - README.md
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - docs/operations/development.md
    acceptance_criteria:
      - 기존 기획·설계 문서를 보존함
      - 로컬 실행·빌드가 가능하며 외부 미연결 상태를 명시함
      - 실행 비용과 외부 의존을 설명하고 미확보 지원금을 운영 수입으로 가정하지 않음
    handoff_file: docs/handoffs/S03-T01.md
    source_requirements:
      - SRC-06
      - SRC-07
  - id: S03-T02
    order: 2
    agent: A1
    title: 초기 스키마와 계약 생성
    status: PLANNED
    depends_on:
      - S03-T01
    condition: always
    prompt: |-
      너는 전공한시간의 A1 아키텍처·DB·API 계약 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      회원·역할·교육자·인증 상태·수업·가능 시간·학습 요청에 필요한 초기 migration과 demo seed를 작성하라.
      노출 스키마·DB 계정 권한을 명시하고 빈 DB 적용을 검증하라.
      API 소비자가 사용할 계약 타입·클라이언트 생성 절차를 연결하라.
      S02의 학교·캠퍼스·생활권·고객군·신원 및 자격 확인 상태를 초기 스키마에 반영하라. seed는 가상 인물임을 표시하고 대학·기관·창업자 경력을 실제 인증·제휴 데이터로 넣지 마라.
    allowed_paths:
      - db/**
      - packages/contracts/**
      - docs/architecture/**
      - docs/api/**
      - docs/handoffs/S03-T02.md
    expected_outputs:
      - db/migrations/
      - db/seeds/
      - packages/contracts/
      - docs/architecture/migration-report.md
    acceptance_criteria:
      - 빈 DB에 초기 migration을 적용할 수 있음
      - 예시 데이터가 운영 데이터와 분리됨
      - 대학 미재학 학습자와 미확인 자격이 표현되고 가상 데이터가 실제 실적으로 집계되지 않음
    handoff_file: docs/handoffs/S03-T02.md
    source_requirements:
      - SRC-01
      - SRC-02
      - SRC-08
  - id: S03-T03
    order: 3
    agent: A2
    title: 인증과 서버 공통 기반
    status: PLANNED
    depends_on:
      - S03-T02
    condition: always
    prompt: |-
      너는 전공한시간의 A2 핵심 업무 백엔드 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      세션 검증·역할 및 리소스 권한 검사·공통 오류·요청 ID·상태 확인 API를 구현하라.
      쿠키 인증의 변경 요청 보호와 서버 자격증명의 브라우저 노출 차단을 확인하라.
      외부 인증 미연결 시 테스트 대역과 실제 인증을 구분하고 운영에서 테스트 우회가 켜지지 않게 하라.
      양측 신원 확인 상태와 교육자의 학교·자격 심사 상태를 구분하고 확인 증빙의 업로드·조회 권한 계약을 적용하라. 학습자의 대학 재학 여부를 로그인·학습 자격의 필수 조건으로 만들지 마라.
    allowed_paths:
      - apps/api/src/**
      - packages/domain/time/**
      - docs/backend/**
      - docs/handoffs/S03-T03.md
    expected_outputs:
      - apps/api/src/
      - docs/backend/auth-foundation.md
    acceptance_criteria:
      - 권한 없는 요청이 거절됨
      - 서버 비밀키가 웹 응답에 노출되지 않음
      - 양측 비공개 증빙에 다른 사용자가 접근할 수 없고 미재학 학습자 진입이 가능함
    handoff_file: docs/handoffs/S03-T03.md
    source_requirements:
      - SRC-02
  - id: S03-T04
    order: 4
    agent: A3
    title: 웹 공통 UI와 인증 흐름
    status: PLANNED
    depends_on:
      - S03-T03
    condition: always
    prompt: |-
      너는 전공한시간의 A3 UX·프론트엔드 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      기본 레이아웃·폼·카드·오류·로딩·빈 상태를 구현하고 로그인·세션·로그아웃을 연결하라.
      사용자 역할별 진입 화면을 제공하되 화면 숨김을 서버 권한 검사의 대체로 사용하지 마라.
      프로젝트 초기 실행 상태를 모바일 화면에서도 확인하라.
    allowed_paths:
      - apps/web/**
      - packages/ui/**
      - docs/ux/**
      - docs/handoffs/S03-T04.md
    expected_outputs:
      - apps/web/
      - packages/ui/
      - docs/ux/foundation-check.md
    acceptance_criteria:
      - 로그인·로그아웃·오류 화면이 연결됨
      - mock과 실제 인증 연결을 구분함
    handoff_file: docs/handoffs/S03-T04.md
  - id: S03-T05
    order: 5
    agent: A6
    title: 기반 통합 검증
    status: PLANNED
    depends_on:
      - S03-T04
    condition: always
    prompt: |-
      너는 전공한시간의 A6 QA·품질 검증 담당이다.
      agent-prompts/00-workflow.yaml의 공통 지침과 현재 단계의 선행 결과를 읽고 이 명령만 수행하라.
      새 개발 환경 기준으로 설치·DB 초기화·빌드·웹과 API 실행을 확인하라.
      인증 성공·실패·세션 만료·권한 거절·운영용 테스트 우회 차단을 검증하라.
      실행 명령과 미검증 외부 환경을 보고하라.
      미재학 학습자의 정상 진입, 교육자 확인 상태 위조, 상대방 증빙 조회 거절을 검증하라.
    allowed_paths:
      - tests/**
      - docs/qa/**
      - docs/handoffs/S03-T05.md
    expected_outputs:
      - tests/integration/
      - tests/e2e/
      - docs/qa/S03-foundation.md
    acceptance_criteria:
      - 재현 가능한 실행·검증 결과가 있음
      - 실행하지 못한 검증을 통과로 표시하지 않음
      - 고객군·신원 확인의 권한 경계가 검증됨
    handoff_file: docs/handoffs/S03-T05.md
    source_requirements:
      - SRC-01
      - SRC-02
  - id: S03-GATE
    order: 6
    agent: A0
    title: 3단계 통합 검증과 완료 판정
    status: PLANNED
    depends_on:
      - S03-T01
      - S03-T02
      - S03-T03
      - S03-T04
      - S03-T05
    condition: always
    prompt: |-
      너는 A0 총괄·통합 담당이다.
      이 단계의 모든 명령 보고와 QA 결과를 확인하고 exit_criteria를 기준으로 통합 버전을 판정하라.
      실패·미검증·외부 의존은 숨기지 말고 소유자에게 보완 작업을 배분하라. 필요한 보완이 완료되면 동일 기준으로 재검증하라.
      완료되지 않은 필수 명령을 임의로 건너뛰지 마라.
      통합 완료 여부와 근거·남은 사항·다음 실행 가능 명령을 기록하라. 다음 단계는 자동 실행하지 마라.
      첨부 문서 반영 사항도 source_requirements 및 agent-prompts/source-alignment.md에 연결해 검증하라.
    allowed_paths:
      - docs/tasks/index.md
      - docs/decisions/**
      - docs/releases/**
      - docs/handoffs/S03-GATE.md
    expected_outputs:
      - docs/releases/S03-gate.md
      - docs/tasks/index.md
    acceptance_criteria:
      - 웹·API·DB의 실행·빌드·검증 명령이 문서화됨
      - 인증·환경 분리·CI와 스테이징 준비 상태가 검증됨
      - 초기 고객군과 신원 확인 상태를 가상 데이터로 구분해 검증함
    handoff_file: docs/handoffs/S03-GATE.md
exit_criteria:
  - 웹·API·DB의 실행·빌드·검증 명령이 문서화됨
  - 인증·환경 분리·CI와 스테이징 준비 상태가 검증됨
  - 초기 고객군과 신원 확인 상태를 가상 데이터로 구분해 검증함
content_revision: 2026-09-19.sources-v2
source_alignment_file: agent-prompts/source-alignment.md
